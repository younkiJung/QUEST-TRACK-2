<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>급식 앱 확인</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #1d2433; color: #fff; font-family: sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 6px 10px; border-bottom: 1px solid #3a4560; vertical-align: top; overflow-wrap: anywhere; }
  td:first-child { width: 2em; }
  .ok { color: #7ee08a; }
  .bad { color: #ff7b7b; font-weight: bold; }
  .note { color: #aab4cc; font-size: 14px; }
  #summary { font-size: 20px; margin: 16px 0; }
  form { display: flex; gap: 8px; margin: 12px 0; }
  input { flex: 1; min-width: 0; font-size: 16px; padding: 6px 10px; }
  button { font-size: 16px; }
</style>
</head>
<body>
<main>
<h1>급식 앱 확인</h1>
<p>앱(../index.html)이 쓰는 파일과 나이스 API 가 잘 돌아가는지 하나씩 확인해요.
학교는 앱에서 고른 학교를 쓰고, 고른 학교가 없으면 아래에 학교 이름을 넣어 주세요.</p>
<form id="form"><input id="q" placeholder="학교 이름 (앱에서 학교를 골랐으면 비워 둬도 돼요)"><button>다시 확인</button></form>
<div id="summary">확인하는 중…</div>
<table id="list"></table>
</main>

<script src="../meal.js"></script>
<script>
const table = document.getElementById('list');
let total = 0, bad = 0;

function row(ok, title, note) {
  total++;
  if (!ok) bad++;
  const r = table.insertRow();
  r.insertCell().textContent = ok ? '✅' : '❌';
  const c = r.insertCell();
  c.appendChild(document.createTextNode(title));
  if (note) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = note;
    c.appendChild(n);
  }
  c.className = ok ? 'ok' : 'bad';
}

function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

// 최근 평일 (오늘이 평일이면 오늘) — 급식 모양을 보려고
function recentWeekday() {
  const d = new Date();
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
  return d;
}

async function run() {
  table.replaceChildren();
  total = 0; bad = 0;
  document.getElementById('summary').textContent = '확인하는 중…';

  // 1. 파일
  const loaded = typeof parseDishes === 'function' && typeof getMeals === 'function';
  row(loaded, 'meal.js 불러오기', loaded ? '앱이 쓰는 함수가 모두 있어요.' : '../meal.js 를 불러오지 못했어요.');
  if (!loaded) return finish();

  // 2. 메뉴 나누기
  const cases = [
    ['궁중비빔밥/볶음고추장 (5.6.16)<br/>달걀실파국1 (1)<br/>귤 ',
      [{ name: '궁중비빔밥/볶음고추장', allergies: [5, 6, 16] }, { name: '달걀실파국1', allergies: [1] }, { name: '귤', allergies: [] }]],
    ['치즈크러스트피자(수제) (1.2.5.6.13.16)',
      [{ name: '치즈크러스트피자(수제)', allergies: [1, 2, 5, 6, 13, 16] }]],
    ['우유 2.<br>현미밥', [{ name: '우유', allergies: [2] }, { name: '현미밥', allergies: [] }]],
    ['', []],
    ['흑미밥 &lt;br/&gt;배추김치 (9)', [{ name: '흑미밥', allergies: [] }, { name: '배추김치', allergies: [9] }]],
    ['돈까스(5.6.10)/소스 (12)<BR>깍두기(9.)', [{ name: '돈까스/소스',allergies: [5, 6, 10, 12] }, { name: '깍두기', allergies: [9] }]],
    ['동파육(중) (5.6.10)< br />보쌈김치/파김치(선택) (9)', [{ name: '동파육(중)', allergies: [5, 6, 10] }, { name: '보쌈김치/파김치(선택)', allergies: [9] }]],
  ];
  cases.forEach(([input, want], i) => {
    const got = parseDishes(input);
    row(same(got, want), `메뉴 나누기 ${i + 1}`, same(got, want) ? JSON.stringify(got) : `기대: ${JSON.stringify(want)} / 실제: ${JSON.stringify(got)}`);
  });

  // 3. 날짜
  const t = todayInfo(new Date(2026, 10, 14));
  row(t.ymd === '20261114' && t.label === '11월 14일 (토)', '날짜 모양', `${t.ymd} · ${t.label}`);

  // 4. 학교 정하기
  let school = null;
  try { school = JSON.parse(localStorage.getItem('meal-school')); } catch (e) {}
  const q = document.getElementById('q').value.trim() || new URLSearchParams(location.search).get('q');
  if (q) {
    try {
      const found = await findSchools(q);
      row(found.length > 0, '학교 찾기 API', found.length ? `${found.length}곳 찾음 (첫 번째: ${found[0].region} · ${found[0].kind})` : '찾은 학교가 없어요. 이름을 확인해 주세요.');
      if (found.length) school = found[0];
    } catch (e) {
      row(false, '학교 찾기 API', e.message);
    }
  } else if (school) {
    row(true, '고른 학교', `앱에서 고른 학교를 써요 (${school.region})`);
  } else {
    row(false, '학교', '앱에서 고른 학교가 없어요. 위에 학교 이름을 넣고 "다시 확인"을 눌러 주세요.');
    return finish();
  }

  // 5. 급식 API
  if (school) {
    const todayYmd = todayInfo().ymd;
    try {
      const meals = await getMeals(school, todayYmd);
      row(true, '오늘 급식 API', meals.length ? `${meals.map(m => m.meal + ' ' + m.dishes.length + '가지').join(', ')}` : '답은 왔고, 오늘은 급식이 없어요 → 앱은 "오늘은 급식이 없습니다"를 보여 줘요.');
    } catch (e) {
      row(false, '오늘 급식 API', e.message);
    }
    const wd = todayInfo(recentWeekday());
    try {
      const meals = await getMeals(school, wd.ymd);
      const dishes = meals.flatMap(m => m.dishes);
      row(true, `최근 평일 급식 API (${wd.label})`, dishes.length ? dishes.map(d => d.name + (d.allergies.length ? ' [' + d.allergies.join('.') + ']' : '')).join(' / ') : '이날도 급식 정보가 없어요 (방학·휴일일 수 있어요).');
    } catch (e) {
      row(false, `최근 평일 급식 API (${wd.label})`, e.message);
    }
  }

  // 6. 못 받아 올 때 까닭 보여 주기
  try {
    await askNeis('없는서비스', {});
    row(false, '오류일 때 까닭', '오류가 나야 하는데 나지 않았어요.');
  } catch (e) {
    row(e.message.length > 0, '오류일 때 까닭', `앱이 보여 줄 글: ${e.message}`);
  }
  // 끝내 답하지 않는 가짜 서버로 바꿔서 시험한다
  const realFetch = window.fetch;
  window.fetch = (url, opts) => new Promise((resolve, reject) => {
    opts.signal.addEventListener('abort', () => reject(new DOMException('멈춤', 'AbortError')));
  });
  try {
    await askNeis('schoolInfo', { SCHUL_NM: '확인용' }, 300);
    row(false, '시간 초과일 때 까닭', '시간 초과가 나야 하는데 나지 않았어요.');
  } catch (e) {
    row(e.message.includes('초 안에'), '시간 초과일 때 까닭', `앱이 보여 줄 글: ${e.message}`);
  } finally {
    window.fetch = realFetch;
  }
  // 인터넷이 끊긴 것처럼 시험한다
  window.fetch = () => Promise.reject(new TypeError('Failed to fetch'));
  try {
    await askNeis('schoolInfo', { SCHUL_NM: '확인용' });
    row(false, '인터넷이 끊겼을 때 까닭', '오류가 나야 하는데 나지 않았어요.');
  } catch (e) {
    row(e.message.includes('인터넷'), '인터넷이 끊겼을 때 까닭', `앱이 보여 줄 글: ${e.message}`);
  } finally {
    window.fetch = realFetch;
  }

  // 7. 인터넷이 끊기면 마지막으로 받은 정보 보여 주기 (진짜 기억은 건드리지 않게 잠깐 빌려 쓰고 돌려놓음)
  let saved = null;
  try { saved = localStorage.getItem(LAST_KEY); } catch (e) {}
  const testSchool = { office: 'T00', code: '0000000' };
  const testMeals = [{ meal: '중식', dishes: [{ name: '확인용 밥', allergies: [] }], kcal: '' }];
  const testTime = new Date(2026, 10, 13, 15, 5).getTime();
  saveLastMeals(testSchool, '20261113', testMeals, testTime);
  window.fetch = () => Promise.reject(new TypeError('Failed to fetch'));
  try {
    const r = await getMealsOrLast(testSchool, '20261114');
    row(r.offline && same(r.meals, testMeals) && r.ymd === '20261113', '끊겼을 때 마지막 정보', `받은 때: ${savedAtLabel(r.savedAt)} · ${ymdLabel(r.ymd)} 식단 · 까닭: ${r.reason}`);
    row(savedAtLabel(testTime) === '11월 13일 (금) 오후 3:05', '받은 때 글 모양', savedAtLabel(testTime));
  } catch (e) {
    row(false, '끊겼을 때 마지막 정보', e.message);
  } finally {
    window.fetch = realFetch;
    try { saved === null ? localStorage.removeItem(LAST_KEY) : localStorage.setItem(LAST_KEY, saved); } catch (e) {}
  }
  window.fetch = () => Promise.reject(new TypeError('Failed to fetch'));
  try {
    await getMealsOrLast({ office: 'T01', code: '1111111' }, '20261114');
    row(false, '마지막 정보도 없을 때', '오류가 나야 하는데 나지 않았어요.');
  } catch (e) {
    row(true, '마지막 정보도 없을 때', `앱이 보여 줄 글: ${e.message}`);
  } finally {
    window.fetch = realFetch;
  }

  // 8. 폰에 설치 (PWA)
  for (const name of ['icon-192.png', 'icon-512.png', 'icon-maskable-512.png']) {
    const ok = await new Promise(res => {
      const img = new Image();
      img.onload = () => res(`${img.naturalWidth}×${img.naturalHeight}`);
      img.onerror = () => res(null);
      img.src = '../icons/' + name;
    });
    row(!!ok, `아이콘 ${name}`, ok || '불러오지 못했어요.');
  }
  if (location.protocol === 'file:') {
    skip('manifest · 서비스 워커', '파일을 두 번 눌러 열면 확인할 수 없어요. GitHub Pages 주소에서 이 페이지를 열면 확인돼요.');
  } else {
    try {
      const m = await (await realFetch('../manifest.webmanifest')).json();
      const sizes = (m.icons || []).map(i => i.sizes);
      const ok = m.name && m.start_url && m.display === 'standalone' && sizes.includes('192x192') && sizes.includes('512x512');
      row(ok, 'manifest', `${m.name} · ${m.display} · 아이콘 ${sizes.join(', ')}`);
    } catch (e) {
      row(false, 'manifest', '../manifest.webmanifest 를 읽지 못했어요.');
    }
    if ('serviceWorker' in navigator) {
      try {
        const reg = await navigator.serviceWorker.register('../sw.js', { scope: '../' });
        const worker = reg.active || reg.waiting || reg.installing;
        if (!reg.active) await new Promise(res => {
          worker.addEventListener('statechange', () => { if (worker.state === 'activated' || worker.state === 'redundant') res(); });
          setTimeout(res, 8000);
        });
        row(!!reg.active, '서비스 워커', reg.active ? `켜짐 (범위: ${reg.scope})` : '켜지지 않았어요.');
        const cache = await caches.open((await caches.keys()).find(k => k.startsWith('meal-app-')) || 'none');
        const stored = (await cache.keys()).length;
        row(stored >= 7, '인터넷 없이 열 파일 저장', `${stored}개 저장됨`);
      } catch (e) {
        row(false, '서비스 워커', e.message);
      }
    } else {
      skip('서비스 워커', '이 브라우저는 서비스 워커를 쓰지 못해요.');
    }
  }

  finish();
}

function skip(title, note) {
  const r = table.insertRow();
  r.insertCell().textContent = '➖';
  const c = r.insertCell();
  c.textContent = title + ' (건너뜀)';
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = note;
  c.appendChild(n);
}

function finish() {
  document.getElementById('summary').innerHTML = bad === 0
    ? `<span class="ok">모두 ${total}개 통과했어요.</span>`
    : `<span class="bad">${total}개 중 ${bad}개가 실패했어요. 아래 ❌ 줄을 확인해 주세요.</span>`;
  document.body.dataset.done = '1';
}

document.getElementById('form').onsubmit = (event) => { event.preventDefault(); run(); };
run();
</script>
</body>
</html>
