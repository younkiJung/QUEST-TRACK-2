<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 급식</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff8ef;
    color: #2b2b2b;
    font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  main { width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  h1 { margin: 0; font-size: 26px; }
  #date { color: #8a6a4a; font-weight: bold; }
  #school { margin: 4px 0 16px; color: #555; font-size: 16px; overflow-wrap: anywhere; }
  button {
    font: inherit; font-size: 16px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid #e0c9ab; background: #fff; color: #2b2b2b; cursor: pointer;
  }
  button.main { background: #ff8a3d; border-color: #ff8a3d; color: #fff; font-weight: bold; }
  .link { border: none; background: none; padding: 0; color: #8a6a4a; text-decoration: underline; font-size: 15px; }

  .card { background: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(120, 80, 30, .1); }
  .card h2 { margin: 0 0 8px; font-size: 18px; color: #ff8a3d; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .kcal { color: #999; font-weight: normal; font-size: 14px; }
  ul.menu { list-style: none; margin: 0; padding: 0; }
  ul.menu li { padding: 8px 0; border-bottom: 1px dashed #f0dfc8; word-break: keep-all; overflow-wrap: anywhere; }
  ul.menu li:last-child { border-bottom: none; }
  .allergy { font-size: 12px; color: #aa8866; margin-left: 6px; white-space: nowrap; }

  .notice { text-align: center; padding: 28px 18px; }
  .notice .big { font-size: 22px; font-weight: bold; margin-bottom: 6px; word-break: keep-all; }
  .notice.error .big { color: #d64545; }
  .notice p { margin: 6px 0 14px; color: #666; font-size: 16px; word-break: keep-all; overflow-wrap: anywhere; }

  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid #e0c9ab; }
  ul.schools { list-style: none; margin: 12px 0 0; padding: 0; }
  ul.schools button { width: 100%; text-align: left; margin-bottom: 8px; }
  ul.schools small { color: #888; }
  .hint { font-size: 14px; color: #888; margin: 10px 0 0; }

  details { margin-top: 18px; font-size: 14px; color: #777; }
  summary { cursor: pointer; }
  details ol { columns: 2; margin: 8px 0 0; padding-left: 26px; }

  @media (min-width: 700px) {
    main { padding-top: 40px; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>오늘 급식</h1>
    <span id="date"></span>
  </header>
  <div id="school"></div>
  <div id="view"></div>

  <details>
    <summary>알레르기 번호 보기</summary>
    <ol id="allergy-list"></ol>
  </details>
</main>

<script src="meal.js"></script>
<script>
const view = document.getElementById('view');
const schoolLine = document.getElementById('school');
const today = todayInfo();
document.getElementById('date').textContent = today.label;

for (let n = 1; n <= 19; n++) {
  const li = document.createElement('li');
  li.textContent = ALLERGY[n];
  document.getElementById('allergy-list').appendChild(li);
}

// 고른 학교는 이 브라우저에만 저장한다 (저장이 막힌 브라우저면 이번에만 기억)
let memory = null;
function loadSchool() {
  try { return JSON.parse(localStorage.getItem('meal-school')) || memory; } catch (e) { return memory; }
}
function saveSchool(school) {
  memory = school;
  try {
    if (school) localStorage.setItem('meal-school', JSON.stringify(school));
    else localStorage.removeItem('meal-school');
  } catch (e) {}
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function notice(kind, big, small, buttonText, onClick) {
  const box = el('div', 'card notice ' + kind);
  box.appendChild(el('div', 'big', big));
  if (small) box.appendChild(el('p', '', small));
  if (buttonText) {
    const b = el('button', 'main', buttonText);
    b.onclick = onClick;
    box.appendChild(b);
  }
  view.replaceChildren(box);
}

function showSchoolLine(school) {
  schoolLine.replaceChildren();
  if (!school) return;
  schoolLine.append(`${school.name} · ${school.region} `);
  const change = el('button', 'link', '학교 바꾸기');
  change.onclick = () => { saveSchool(null); start(); };
  schoolLine.appendChild(change);
}

// 1) 학교 고르기
function showSchoolPicker() {
  showSchoolLine(null);
  const card = el('div', 'card');
  card.appendChild(el('h2', '', '우리 학교 찾기'));
  const form = el('form');
  const input = el('input');
  input.placeholder = '학교 이름';
  input.required = true;
  form.append(input, el('button', 'main', '찾기'));
  const status = el('p', 'hint', '처음 한 번만 고르면 이 기기에 기억해요.');
  const list = el('ul', 'schools');
  card.append(form, status, list);
  view.replaceChildren(card);
  input.focus();

  form.onsubmit = async (event) => {
    event.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    list.replaceChildren();
    status.textContent = '학교를 찾는 중이에요…';
    try {
      const schools = await findSchools(name);
      if (schools.length === 0) {
        status.textContent = `"${name}" 이름의 학교를 찾지 못했어요. 학교 이름을 정확히 적어 주세요 (예: ○○중학교).`;
        return;
      }
      status.textContent = schools.length >= 5
        ? '5곳까지만 보여요. 찾는 학교가 없으면 이름을 더 정확히 적어 주세요.'
        : '우리 학교를 눌러 주세요.';
      for (const school of schools) {
        const b = el('button');
        b.append(school.name + ' ');
        b.appendChild(el('small', '', `${school.region} · ${school.kind}`));
        b.onclick = () => { saveSchool(school); start(); };
        const li = el('li');
        li.appendChild(b);
        list.appendChild(li);
      }
    } catch (e) {
      status.textContent = '학교를 찾지 못했어요. ' + e.message;
    }
  };
}

// 2) 오늘 급식 보여 주기
async function showMeals(school) {
  showSchoolLine(school);
  notice('loading', '급식을 불러오는 중이에요…', '나이스에서 오늘 식단을 받아 오고 있어요.');
  try {
    const meals = await getMeals(school, today.ymd);
    if (meals.length === 0) {
      notice('empty', '오늘은 급식이 없습니다', '주말·방학·휴일이거나 학교가 식단을 아직 올리지 않았을 수 있어요.');
      return;
    }
    view.replaceChildren();
    for (const meal of meals) {
      const card = el('div', 'card');
      const h2 = el('h2', '', meal.meal);
      if (meal.kcal) h2.appendChild(el('span', 'kcal', meal.kcal));
      card.appendChild(h2);
      const ul = el('ul', 'menu');
      for (const dish of meal.dishes) {
        const li = el('li', '', dish.name);
        if (dish.allergies.length) {
          const small = el('span', 'allergy', dish.allergies.join('.'));
          small.title = dish.allergies.map(n => ALLERGY[n]).join(', ');
          li.appendChild(small);
        }
        ul.appendChild(li);
      }
      card.appendChild(ul);
      view.appendChild(card);
    }
  } catch (e) {
    notice('error', '급식을 받아 오지 못했어요', e.message, '다시 해 보기', () => showMeals(school));
  }
}

function start() {
  const school = loadSchool();
  if (school && school.office && school.code) showMeals(school);
  else showSchoolPicker();
}
start();
</script>
</body>
</html>
