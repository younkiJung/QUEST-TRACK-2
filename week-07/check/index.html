<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랫폼 게임 확인</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #1d2433; color: #fff; font-family: sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 6px 10px; border-bottom: 1px solid #3a4560; vertical-align: top; overflow-wrap: anywhere; }
  td:first-child { width: 2em; }
  .ok { color: #7ee08a; }
  .bad { color: #ff7b7b; font-weight: bold; }
  .note { color: #aab4cc; font-size: 14px; }
  #summary { font-size: 20px; margin: 16px 0; }
  button { font-size: 16px; }
  iframe { position: absolute; left: -9999px; top: 0; border: 0; height: 700px; }
</style>
</head>
<body>
<main>
<h1>플랫폼 게임 확인</h1>
<p>게임(../index.html)이 쓰는 파일, 저장, 스테이지, 화면을 하나씩 확인해요.
확인할 때 게임의 진짜 기록은 잠깐 빌려 쓰고 끝나면 그대로 돌려놓아요.</p>
<button id="again">다시 확인</button>
<div id="summary">확인하는 중…</div>
<table id="list"></table>
</main>

<script src="../save.js"></script>
<script src="../physics.js"></script>
<script src="../stages.js"></script>
<script src="../ranking.js"></script>
<script src="bot.js"></script>
<script>
const table = document.getElementById('list');
let total = 0, bad = 0;

function row(ok, title, note) {
  total++;
  if (!ok) bad++;
  const r = table.insertRow();
  r.insertCell().textContent = ok ? '✅' : '❌';
  const c = r.insertCell();
  c.appendChild(document.createTextNode(title));
  if (note) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = note;
    c.appendChild(n);
  }
  c.className = ok ? 'ok' : 'bad';
}

function skip(title, note) {
  const r = table.insertRow();
  r.insertCell().textContent = '➖';
  const c = r.insertCell();
  c.textContent = title + ' (건너뜀)';
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = note;
  c.appendChild(n);
}

function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

function loadFrame(src, width) {
  return new Promise((resolve, reject) => {
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.onload = () => resolve(f);
    f.onerror = () => reject(new Error('불러오지 못했어요'));
    f.src = src;
    document.body.appendChild(f);
    setTimeout(() => reject(new Error('시간 안에 불러오지 못했어요')), 8000);
  });
}

async function run() {
  table.replaceChildren();
  total = 0; bad = 0;
  document.getElementById('summary').textContent = '확인하는 중…';

  // 1. 파일
  const loaded = typeof loadSave === 'function' && typeof stepPlayer === 'function' && Array.isArray(STAGES);
  row(loaded, 'save.js · physics.js · stages.js 불러오기', loaded ? '게임이 쓰는 함수와 스테이지가 모두 있어요.' : '../ 에 있는 파일을 불러오지 못했어요.');
  if (!loaded) return finish();

  // 2. 저장 (진짜 기록은 빌려 쓰고 돌려놓음)
  let backup = null, backupOwners = null;
  try { backup = localStorage.getItem(SAVE_KEY); backupOwners = localStorage.getItem(OWNERS_KEY); } catch (e) {}
  try {
    localStorage.removeItem(SAVE_KEY);
    row(same(loadSave(), { v: 1, owner: '', stages: {} }), '기록이 없을 때', '빈 기록으로 시작해요.');
    row(cleanName('  가   나  ') === '가 나' && cleanName('1234567890123456') === '123456789012' && cleanName(null) === '',
      '이름 다듬기', `"  가   나  " → "${cleanName('  가   나  ')}" · 긴 이름은 12글자까지`);
    setOwner('  토끼 ');
    row(loadSave().owner === '토끼', '주인 이름 저장', `다시 읽으면 "${loadSave().owner}"`);

    const r1 = recordClear(1, 3);
    row(r1.firstClear && r1.saved && loadSave().stages['1'].coins === 3, '처음 깼을 때 저장', '스테이지 1 코인 3개');
    const r2 = recordClear(1, 5);
    row(r2.improved && loadSave().stages['1'].coins === 5, '코인을 더 모으면 기록이 늘어요', '3개 → 5개');
    const r3 = recordClear(1, 2);
    row(!r3.improved && loadSave().stages['1'].coins === 5, '코인이 적으면 기록이 그대로예요', '5개 유지');
    recordClear(2, 4);
    row(totalCoins(loadSave()) === 9, '코인 합계', `5 + 4 = ${totalCoins(loadSave())}`);
    const s = loadSave();
    row(isUnlocked(s, 1) && isUnlocked(s, 2) && isUnlocked(s, 3) && !isUnlocked(s, 4), '스테이지 열림', '깬 스테이지의 다음까지 열려요 (1·2·3 열림, 4 잠김)');
    localStorage.removeItem(SAVE_KEY);
    row(isUnlocked(loadSave(), 1) && !isUnlocked(loadSave(), 2), '처음엔 1번만 열려요', '기록이 없을 때 2번은 잠김');

    localStorage.setItem(SAVE_KEY, '{망가진 글');
    let broken = true;
    try { broken = !same(loadSave(), { v: 1, owner: '', stages: {} }); } catch (e) { broken = true; }
    row(!broken, '망가진 기록', '읽을 수 없는 글이어도 오류 없이 빈 기록으로 시작해요.');
    localStorage.setItem(SAVE_KEY, JSON.stringify({ owner: '<b>x</b>', stages: { '1': { cleared: true, coins: -5 }, 'abc': { cleared: true, coins: 3 }, '2': { cleared: false, coins: 9 } } }));
    const odd = loadSave();
    row(Object.keys(odd.stages).length === 1 && odd.stages['1'].coins === 0, '이상한 기록 걸러내기', `남은 스테이지 ${Object.keys(odd.stages).join(',')} · 음수 코인은 0`);

    // 최고기록 (가장 빠른 시간, 1/100초 단위)
    localStorage.removeItem(SAVE_KEY);
    const t1 = recordClear(1, 5, 1234);
    row(t1.newBest && t1.prevTime === null && loadSave().stages['1'].time === 1234, '처음 깨면 그 시간이 최고기록', '12.34초 저장');
    const t2 = recordClear(1, 5, 1500);
    row(!t2.newBest && t2.bestTime === 1234 && loadSave().stages['1'].time === 1234, '더 느리면 최고기록 그대로', '15.00초로 깼지만 12.34초 유지');
    const t3 = recordClear(1, 5, 1100);
    row(t3.newBest && t3.prevTime === 1234 && loadSave().stages['1'].time === 1100, '더 빠르면 최고기록 바꿈', '12.34초 → 11.00초');
    const t4 = recordClear(1, 5, 1100);
    row(!t4.newBest && loadSave().stages['1'].time === 1100, '같은 시간은 새 기록이 아니에요', '11.00초 = 11.00초');
    const t5 = recordClear(1, 5);
    row(!t5.newBest && loadSave().stages['1'].time === 1100, '시간을 안 주면 기록을 건드리지 않아요', '코인만 저장할 때도 시간이 지워지지 않아요');
    const t6 = recordClear(2, 4, 900);
    row(loadSave().stages['1'].time === 1100 && loadSave().stages['2'].time === 900, '스테이지마다 따로 저장', '1번 11.00초 · 2번 9.00초');
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, owner: '옛', stages: { '1': { cleared: true, coins: 2 } } }));
    const old = loadSave();
    row(old.stages['1'].time === undefined && recordClear(1, 2, 3000).newBest, '시간이 없는 옛 기록', '읽을 수 있고, 다음에 깨면 그 시간이 최고기록이 돼요.');
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, owner: 'x', stages: { '1': { cleared: true, coins: 1, time: -5 }, '2': { cleared: true, coins: 1, time: 'abc' }, '3': { cleared: true, coins: 1, time: 12.5 } } }));
    const badTime = loadSave();
    row(['1', '2', '3'].every(k => badTime.stages[k] && badTime.stages[k].time === undefined), '이상한 시간 걸러내기', '음수·글자·소수는 버리고 나머지 기록은 살려요.');

    // 별 (한 판 안에서 정해진 별 개수의 최고)
    localStorage.removeItem(SAVE_KEY);
    const s1 = recordClear(1, 3, 2000, 1);
    row(s1.starsImproved && s1.prevStars === 0 && loadSave().stages['1'].stars === 1, '처음 깨면 그 별이 저장돼요', '별 1개');
    const s2 = recordClear(1, 5, 1100, 3);
    row(s2.starsImproved && s2.prevStars === 1 && loadSave().stages['1'].stars === 3, '별을 더 받으면 늘어요', '1개 → 3개');
    const s3 = recordClear(1, 2, 3000, 1);
    row(!s3.starsImproved && s3.bestStars === 3 && loadSave().stages['1'].stars === 3, '별이 적으면 최고 별 그대로', '1개로 깼어도 3개 유지');
    const s4 = recordClear(1, 5, 1100);
    row(!s4.starsImproved && loadSave().stages['1'].stars === 3, '별을 안 주면 별을 건드리지 않아요', '3개 유지');
    recordClear(2, 4, 900, 2);
    row(loadSave().stages['1'].stars === 3 && loadSave().stages['2'].stars === 2, '스테이지마다 따로 저장', '1번 별 3개 · 2번 별 2개');
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, owner: '옛', stages: { '1': { cleared: true, coins: 2, time: 1500 } } }));
    row(loadSave().stages['1'].stars === undefined && recordClear(1, 2, 1500, 1).starsImproved === true, '별이 없던 옛 기록', '읽을 수 있고 코인·시간은 그대로예요. 다음에 깨면 별이 저장돼요.');
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, owner: 'x', stages: { '1': { cleared: true, coins: 1, stars: 0 }, '2': { cleared: true, coins: 1, stars: 4 }, '3': { cleared: true, coins: 1, stars: 'abc' } } }));
    const badStars = loadSave();
    row(['1', '2', '3'].every(k => badStars.stages[k] && badStars.stages[k].stars === undefined && badStars.stages[k].coins === 1), '이상한 별 걸러내기', '0·4·글자는 버리고 나머지 기록은 살려요.');
    const vs = recordClear(1, 1, 1000, 9);
    row(!vs.starsImproved && vs.bestStars === null, '별 개수가 이상하게 들어와도', '1~3이 아니면 저장하지 않아요.');

    // 기록 내보내기 · 불러오기 (파일 글을 만들고 검사하는 규칙)
    localStorage.removeItem(SAVE_KEY);
    setOwner('토끼'); recordClear(1, 5, 1100, 3); recordClear(2, 4, 900, 2);
    const cur = loadSave();
    const fileText = makeExportText(cur);
    let fileObj = null;
    try { fileObj = JSON.parse(fileText); } catch (e) {}
    row(!!fileObj && same(Object.keys(fileObj).sort(), ['app', 'exportedAt', 'owner', 'stages', 'v']) && fileObj.app === 'platformer-save' && fileObj.v === 1,
      '내보낸 파일 모양', '앱 표시 · 버전 · 날짜 · 이름 · 스테이지 기록만 들어 있어요 (다른 정보는 없어요).');
    const back = parseImport(fileText, STAGES);
    row(back.ok && same(back.save, cur) && back.dropped === 0, '내보냈다가 불러오면 똑같아요', `이름 ${back.ok ? back.save.owner : '?'} · 스테이지 ${back.ok ? Object.keys(back.save.stages).length : '?'}개`);
    row(same(loadSave(), cur), '파일 검사만으로는 기록이 바뀌지 않아요', '검사는 읽기만 해요.');
    const bads = [
      ['글자', '이건 기록이 아니에요'], ['빈 글', ''], ['배열', '[1,2]'],
      ['다른 앱', JSON.stringify({ app: 'other', v: 1, owner: 'a', stages: {} })],
      ['앱 표시 없음', JSON.stringify({ v: 1, owner: 'a', stages: {} })],
      ['더 새로운 버전', JSON.stringify({ app: 'platformer-save', v: 2, owner: 'a', stages: {} })],
      ['옛 버전', JSON.stringify({ app: 'platformer-save', v: 0, owner: 'a', stages: {} })],
      ['빈 기록', JSON.stringify({ app: 'platformer-save', v: 1, owner: '', stages: {} })],
      ['너무 큰 파일', 'x'.repeat(200001)],
    ];
    const notRejected = bads.filter(([, t]) => { const r = parseImport(t, STAGES); return r.ok || !r.error; }).map(b => b[0]);
    row(notRejected.length === 0, '잘못된 파일은 이유를 알려 주고 거절해요', notRejected.length ? '거절하지 못한 것: ' + notRejected.join(', ') : bads.map(b => b[0]).join(' · '));
    const mixed = parseImport(JSON.stringify({ app: 'platformer-save', v: 1, owner: '  <b>x</b>  ', stages: {
      '1': { cleared: true, coins: 99, stars: 3, time: 500 }, '7': { cleared: true, coins: 1 }, 'abc': { cleared: true, coins: 1 },
      '2': { cleared: false, coins: 3 }, '3': { cleared: true, coins: 2, stars: 9 } } }), STAGES);
    row(mixed.ok && same(Object.keys(mixed.save.stages), ['1', '3']) && mixed.save.stages['1'].coins === 5 && mixed.save.stages['3'].stars === undefined && mixed.dropped === 3 && mixed.save.owner === '<b>x</b>',
      '이상한 값은 걸러내고 나머지는 살려요', mixed.ok ? `남은 스테이지 ${Object.keys(mixed.save.stages)} · 없는 스테이지·망가진 기록 ${mixed.dropped}개 뺌 · 코인은 스테이지 코인 수까지만` : mixed.error);
    const onlyOwner = parseImport(JSON.stringify({ app: 'platformer-save', v: 1, owner: '새 기기', stages: {} }), STAGES);
    row(onlyOwner.ok && onlyOwner.save.owner === '새 기기', '이름만 있는 파일도 불러와요', '아직 스테이지를 안 깬 기록');
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, owner: '다른 사람', stages: {} }));
    const rep = replaceSave(back.save);
    row(rep.saved && same(loadSave(), cur), '바꾸기를 하면 파일의 기록이 돼요', '지금 기록이 파일의 기록으로 통째로 바뀌어요.');

    // 주인 보관 (주인별 랭킹)
    localStorage.removeItem(SAVE_KEY); localStorage.removeItem(OWNERS_KEY);
    row(same(archivedNames(), []) && same(loadOwners(), {}), '보관된 주인이 없을 때', '빈 보관함으로 시작해요.');
    setOwner('토끼'); recordClear(1, 5, 1100, 3); recordClear(2, 4, 900, 2);
    const mine = loadSave();
    const n1 = startNewOwner();
    row(n1.archived === '토끼' && n1.saved && same(loadSave(), { v: 1, owner: '', stages: {} }) && same(loadOwners()['토끼'].stages, mine.stages),
      '"새 주인으로 시작"은 지금 주인을 보관하고 기록을 비워요', `보관: ${archivedNames().join(', ')} · 지금 기록: 이름 없음`);
    setOwner('고양이'); recordClear(1, 5, 900, 3);
    startNewOwner();
    row(same(archivedNames().sort(), ['고양이', '토끼']), '주인이 여럿 보관돼요', archivedNames().join(', '));
    const tk1 = takeArchivedOwner('토끼');
    row(!!tk1 && same(tk1, mine) && same(loadSave(), mine) && same(archivedNames(), ['고양이']), '같은 이름을 쓰면 보관된 주인으로 이어 해요', '토끼의 기록이 그대로 돌아오고 보관함에서는 빠져요.');
    const tNone = takeArchivedOwner('없는사람'), tEmpty = takeArchivedOwner('');
    row(tNone === null && tEmpty === null && same(loadSave(), mine) && same(archivedNames(), ['고양이']), '보관에 없는 이름은 아무것도 바꾸지 않아요', '없는 이름·빈 이름');
    localStorage.removeItem(SAVE_KEY);
    const n3 = startNewOwner();
    row(n3.archived === null && same(archivedNames(), ['고양이']), '이름 없는 기록은 보관하지 않아요', '보관함은 그대로');
    localStorage.setItem(OWNERS_KEY, '{망가진');
    row(same(loadOwners(), {}), '망가진 보관함', '오류 없이 빈 보관함으로 읽어요.');
    localStorage.setItem(OWNERS_KEY, JSON.stringify({ v: 1, owners: {
      ' 공백 ': { stages: { '1': { cleared: true, coins: 1 } } }, '': { stages: {} }, '열두글자를넘는아주아주긴이름': { stages: {} },
      '정상': { stages: { '1': { cleared: true, coins: 2, stars: 3 }, '9x': { cleared: true, coins: 1 } } } } }));
    const co = loadOwners();
    row(same(Object.keys(co), ['정상']) && same(Object.keys(co['정상'].stages), ['1']), '이상한 보관 기록 걸러내기', '다듬은 이름과 다른 이름·빈 이름·이상한 스테이지는 버리고 정상은 살려요.');
  } finally {
    try { backupOwners === null ? localStorage.removeItem(OWNERS_KEY) : localStorage.setItem(OWNERS_KEY, backupOwners); } catch (e) {}
    try { backup === null ? localStorage.removeItem(SAVE_KEY) : localStorage.setItem(SAVE_KEY, backup); } catch (e) {}
  }

  // 3. 움직임 규칙
  const flat = { width: 1000, start: { x: 100, y: 300 }, platforms: [{ x: 0, y: 390, w: 1000, h: 60 }], coins: [], goal: { x: 990, y: 0, w: 5, h: 5 } };
  let p = newPlayer(flat);
  for (let i = 0; i < 30; i++) stepPlayer(p, {}, flat);
  row(p.onGround && p.y === 390 - PHYS.H, '땅에 서기', `y = ${p.y}`);
  let top = p.y;
  for (let i = 0; i < 80; i++) { stepPlayer(p, { jump: true }, flat); top = Math.min(top, p.y); }
  const height = 390 - PHYS.H - top;
  row(height >= 100 && height <= 130, '점프 높이', `${Math.round(height)} (발판 사이 높이차가 이보다 작아야 올라가요)`);
  p = newPlayer(flat);
  for (let i = 0; i < 30; i++) stepPlayer(p, {}, flat);
  let short = p.y;
  stepPlayer(p, { jump: true }, flat);
  for (let i = 0; i < 80; i++) { stepPlayer(p, {}, flat); short = Math.min(short, p.y); }
  row(390 - PHYS.H - short < height - 20, '짧게 누르면 낮게 뛰어요', `${Math.round(390 - PHYS.H - short)} < ${Math.round(height)}`);
  const wall = { ...flat, platforms: [{ x: 0, y: 390, w: 1000, h: 60 }, { x: 300, y: 200, w: 50, h: 190 }] };
  p = newPlayer(wall);
  for (let i = 0; i < 200; i++) stepPlayer(p, { right: true }, wall);
  row(p.x === 300 - PHYS.W, '벽을 뚫지 못해요', `x = ${p.x}`);
  const pit = { ...flat, platforms: [{ x: 0, y: 390, w: 200, h: 60 }] };
  p = newPlayer(pit);
  for (let i = 0; i < 200 && !p.dead; i++) stepPlayer(p, { right: true }, pit);
  row(p.dead, '구멍에 빠지면 처음 자리로', p.dead ? '떨어짐을 알아차려요.' : '떨어졌는데 알아차리지 못했어요.');
  p = newPlayer(flat);
  for (let i = 0; i < 30; i++) stepPlayer(p, {}, flat);
  const before = p.x;
  for (let i = 0; i < 30; i++) stepPlayer(p, { left: true }, flat);
  row(p.x === Math.max(0, before - 30 * PHYS.SPEED), '왼쪽·오른쪽 걷기', `${before} → ${p.x}`);

  // 4. 스테이지
  row(STAGES.length >= 3 && STAGES.every((st, i) => st.id === i + 1), '스테이지 개수·번호', `${STAGES.length}개 (${STAGES.map(st => st.name).join(' · ')})`);
  for (const st of STAGES) {
    const inside = st.coins.every(c => c.x > 0 && c.x < st.width);
    const reachable = st.coins.every(c => st.platforms.some(r => c.x >= r.x - 10 && c.x <= r.x + r.w + 10 && r.y - c.y >= 10 && r.y - c.y <= 120));
    const notInside = st.coins.every(c => !st.platforms.some(r => c.x >= r.x && c.x <= r.x + r.w && c.y >= r.y && c.y <= r.y + r.h));
    row(st.coins.length > 0 && inside && reachable && notInside, `스테이지 ${st.id} 코인 자리`, `${st.coins.length}개 · 발판 위 120 안에 있고, 발판 속에 묻히지 않았어요.`);
    const bot = tryBot(st);
    row(bot.ok, `스테이지 ${st.id} 깰 수 있어요`, bot.ok ? `로봇이 깃발까지 갔어요 (${(bot.frames / 60).toFixed(1)}초, 코인 ${bot.coins}/${st.coins.length})` : `로봇이 깃발에 닿지 못했어요 (코인 ${bot.coins}/${st.coins.length})`);
  }

  // 4-2. 스테이지 3개가 점점 어려워지는지 (난이도를 숫자로 비교)
  row(STAGES.length === 3, '스테이지는 3개', `지금 ${STAGES.length}개`);
  const stats = STAGES.map(st => {
    // 구멍: 시작~깃발 사이에서 어떤 발판 밑에도 들지 않는 가로 구간
    const spans = st.platforms.map(r => [r.x, r.x + r.w]).sort((a, b) => a[0] - b[0]);
    let reach = 0; const pits = [];
    for (const [a, b] of spans) { if (a > reach) pits.push(a - reach); reach = Math.max(reach, b); }
    const floating = st.platforms.filter(r => r.h === 20).map(r => r.w);
    return { length: st.width, coins: st.coins.length, pits: pits.length, maxPit: Math.max(0, ...pits),
             totalPit: pits.reduce((s, v) => s + v, 0), narrow: Math.min(...floating), seconds: tryBot(st).frames / 60 };
  });
  const rising = (key, label, unit, sign = 1) => {
    const v = stats.map(s => s[key]);
    const ok = v.every((x, i) => i === 0 || (x - v[i - 1]) * sign > 0);
    row(ok, `${label} ${sign > 0 ? '늘어나요' : '줄어들어요'}`, v.map(x => (Number.isInteger(x) ? x : x.toFixed(1)) + unit).join(sign > 0 ? ' < ' : ' > '));
  };
  rising('length', '스테이지 길이가', '');
  rising('coins', '코인 개수가', '개');
  rising('pits', '구멍 개수가', '개');
  rising('maxPit', '가장 넓은 구멍이', '');
  rising('totalPit', '구멍 전체 폭이', '');
  rising('narrow', '가장 좁은 떠 있는 발판이', '', -1);
  rising('seconds', '로봇이 깨는 데 걸리는 시간이', '초');
  const levels = STAGES.map(st => st.level);
  row(same(levels, [1, 2, 3]) && STAGES.every(st => typeof st.hint === 'string' && st.hint.length > 0 && typeof st.name === 'string' && st.name.length > 0),
    '난이도 표시와 설명이 있어요', `level ${levels.join(', ')} · 모든 스테이지에 이름과 한 줄 설명이 있어요.`);
  const shapeOk = STAGES.every(st => {
    const startFree = !st.platforms.some(r => overlaps({ x: st.start.x, y: st.start.y }, r));
    const startStand = st.platforms.some(r => st.start.x >= r.x && st.start.x + PHYS.W <= r.x + r.w && r.y - (st.start.y + PHYS.H) >= 0 && r.y - (st.start.y + PHYS.H) <= 30);
    const goalStand = st.platforms.some(r => st.goal.x >= r.x && st.goal.x + st.goal.w <= r.x + r.w && r.y === st.goal.y + st.goal.h);
    const goalInside = st.goal.x + st.goal.w <= st.width;
    const coinsDistinct = new Set(st.coins.map(c => c.x + ',' + c.y)).size === st.coins.length;
    return startFree && startStand && goalStand && goalInside && coinsDistinct;
  });
  row(shapeOk, '스테이지 데이터 모양', '시작 자리는 발판 바로 위(30 안)에 있고, 깃발은 발판 위·스테이지 안에 있고, 코인이 겹치지 않아요.');

  // 4-3. 별 계산 (스테이지 1: 코인 5개, 목표 12초)
  {
    const st = STAGES[0];
    const cases = [
      [5, 1100, 3, '코인 다 + 빨리'], [5, 1300, 2, '코인 다 + 느림'], [4, 1100, 2, '코인 모자람 + 빨리'], [4, 1300, 1, '코인 모자람 + 느림'],
      [5, 1200, 3, '딱 목표 시간(12.00초)은 빠른 걸로 쳐요'], [5, 1201, 2, '12.01초는 느린 걸로 쳐요'], [0, 100, 2, '코인 0개여도 빠르면 별 2개'],
    ];
    const wrong = cases.filter(([c, t, want]) => calcStars(st, c, t).stars !== want);
    row(wrong.length === 0, '별 계산', wrong.length ? '틀린 것: ' + wrong.map(b => b[3]).join(', ') : cases.map(c => `${c[3]} → ${c[2]}`).join(' · '));
  }
  const parOk = STAGES.every(st => Number.isFinite(st.par) && st.par > 0);
  row(parOk && STAGES.every((st, i) => i === 0 || st.par > STAGES[i - 1].par), '목표 시간이 있고 점점 길어져요', STAGES.map(st => st.par + '초').join(' < '));
  for (const st of STAGES) {
    const bot = tryBot(st);
    const seconds = bot.frames / 60;
    const three = bot.ok && bot.coins === st.coins.length && seconds <= st.par;
    row(three, `스테이지 ${st.id} 별 3개를 받을 수 있어요`, `로봇이 코인 ${bot.coins}/${st.coins.length}개를 먹고 ${seconds.toFixed(1)}초에 깼어요 (목표 ${st.par}초)`);
    row(st.par >= seconds * 1.3 && st.par <= seconds * 2.5, `스테이지 ${st.id} 목표 시간이 알맞아요`, `로봇 기록의 ${(st.par / seconds).toFixed(2)}배 (1.3~2.5배면 사람이 해 볼 만해요)`);
  }

  // 4-4. 주인별 랭킹 계산
  {
    const cur = { owner: '토끼', stages: { '1': { cleared: true, coins: 5, time: 1100, stars: 3 }, '2': { cleared: true, coins: 4, time: 900, stars: 2 } } };
    const owners = {
      '고양이': { owner: '고양이', stages: { '1': { cleared: true, coins: 5, time: 900, stars: 3 }, '2': { cleared: true, coins: 7, time: 1200, stars: 3 }, '3': { cleared: true, coins: 9, time: 1500, stars: 3 } } },
      '강아지': { owner: '강아지', stages: { '1': { cleared: true, coins: 5, time: 1100, stars: 3 }, '2': { cleared: true, coins: 4, time: 900, stars: 2 } } },
      '새내기': { owner: '새내기', stages: {} },
      '옛': { owner: '옛', stages: { '1': { cleared: true, coins: 2 } } },
    };
    const r = buildRanking(cur, owners, STAGES);
    row(same(r.overall.map(o => o.name), ['고양이', '강아지', '토끼', '옛', '새내기']), '전체 순서: 별 → 코인 순', r.overall.map(o => `${o.name}(별${o.stars}·코인${o.coins})`).join(' > '));
    row(same(r.overall.map(o => o.rank), [1, 2, 2, 4, 5]), '같은 기록은 같은 순위 (1, 2, 2, 4, 5)', r.overall.map(o => o.rank + '위').join(' '));
    row(same(r.overall.map(o => o.current), [false, false, true, false, false]), '지금 주인 표시', '토끼만 지금 주인이에요.');
    const names = (i) => r.perStage[i].rows.map(o => o.name + o.rank).join(' ');
    row(names(0) === '고양이1 강아지2 토끼2' && names(1) === '강아지1 토끼1 고양이3' && names(2) === '고양이1' && r.perStage.length === STAGES.length,
      '스테이지별 순서: 가장 빠른 시간', `1번: ${names(0)} · 2번: ${names(1)} · 3번: ${names(2)} (시간 기록이 없는 주인은 빠져요)`);
    const dup = buildRanking(cur, { '토끼': { owner: '토끼', stages: {} } }, STAGES);
    row(dup.overall.length === 1 && dup.overall[0].stars === 5 && dup.overall[0].current, '같은 이름이면 지금 기록을 써요', '보관함에 옛 토끼가 있어도 한 번만 나와요.');
    const noCur = buildRanking({ owner: '', stages: {} }, owners, STAGES);
    row(noCur.overall.length === 4 && noCur.overall.every(o => !o.current), '지금 기록에 이름이 없으면 넣지 않아요', `${noCur.overall.length}명`);
    const nobody = buildRanking({ owner: '', stages: {} }, {}, STAGES);
    row(nobody.overall.length === 0 && nobody.perStage.every(s => s.rows.length === 0), '아무도 없을 때', '빈 랭킹으로 오류 없이 나와요.');
  }

  // 5. 게임 화면 (파일 내용과 모양)
  let html = null;
  try { html = await (await fetch('../index.html')).text(); } catch (e) {}
  if (html === null) {
    skip('화면 글 확인', '파일을 두 번 눌러 열면 읽을 수 없어요. GitHub Pages 주소에서 이 페이지를 열거나 간단한 서버로 열면 확인돼요.');
  } else {
    row(/name="viewport"[^>]*width=device-width/.test(html), '화면 폭에 맞추기 (viewport)', 'width=device-width 가 있어요.');
    row(/id="login-slot"[^>]*>\s*로그인 자리\s*</.test(html), '로그인 단추 자리', '"로그인 자리" 라고만 쓰여 있어요.');
    const slot = html.match(/<div id="login-slot"[^>]*>[\s\S]*?<\/div>/);
    row(!!slot && !/<(button|a|input|form)/i.test(slot[0]) && !/type="password"/i.test(html), '로그인은 아직 없어요', '로그인 자리는 빈 칸이고, 비밀번호 입력도 없어요.');
    const files = { 'index.html': html };
    for (const f of ['physics.js', 'stages.js']) { try { files[f] = await (await fetch('../' + f)).text(); } catch (e) { files[f] = ''; } }
    const storageWords = /localStorage|sessionStorage|indexedDB|document\.cookie/;
    const where = Object.keys(files).filter(f => storageWords.test(files[f]));
    row(where.length === 0, '저장 코드는 save.js 한곳에만', where.length ? `다른 파일에도 있어요: ${where.join(', ')}` : 'index.html · physics.js · stages.js 에는 저장 코드가 없어요.');
    row(!/(sk-|api[_-]?key|password)\s*[:=]/i.test(html), '비밀번호·키가 적혀 있지 않아요', 'index.html 확인');

    // 폰과 컴퓨터 폭에서 잘리는지 (게임을 실제로 열어 봄)
    for (const [w, label] of [[360, '폰 (360)'], [768, '태블릿 (768)'], [1280, '컴퓨터 (1280)']]) {
      try {
        const f = await loadFrame('../index.html', w);
        const d = f.contentDocument;
        const flow = d.documentElement.scrollWidth <= w;
        const slotRect = d.getElementById('login-slot').getBoundingClientRect();
        const slotIn = slotRect.left >= 0 && slotRect.right <= w;
        const nameShown = !d.getElementById('name-screen').hidden || !d.getElementById('select-screen').hidden;
        row(flow && slotIn && nameShown, `화면 폭 ${label}`, `가로로 넘치지 않고 로그인 자리가 보여요 (내용 폭 ${d.documentElement.scrollWidth})`);
        f.remove();
      } catch (e) {
        skip(`화면 폭 ${label}`, '게임 화면을 이 페이지 안에서 열 수 없었어요: ' + e.message);
      }
    }
  }

  // 6. 게임 화면에서 최고기록 (게임을 실제로 열어 깬 것처럼 만들어 봄. 진짜 기록은 빌려 쓰고 돌려놓음)
  if (html !== null) {
    let f = null, ls = null, saved = null;
    try {
      f = await loadFrame('../index.html', 800);
      const win = f.contentWindow;
      ls = win.localStorage;
      saved = ls.getItem(SAVE_KEY);
      ls.removeItem(SAVE_KEY);
      row(win.formatTime(1234) === '12.34' && win.formatTime(500) === '5.00' && win.formatTime(6005) === '60.05', '시간 글 모양', '1234 → 12.34 · 500 → 5.00 · 6005 → 60.05');
      const clearOnce = (frames) => win.eval(`save = loadSave(); startStage(STAGES[0]); run.t = ${frames}; finish(); document.getElementById('clear').innerText`);
      const a = clearOnce(740);      // 12.33초 (740/60)
      row(a.includes('NEW!') && a.includes('첫 기록') && a.includes('12.33'), '처음 깬 화면에 NEW!', a.replace(/\s+/g, ' '));
      const b = clearOnce(900);      // 15.00초 — 더 느림
      row(!b.includes('NEW!') && b.includes('15.00') && b.includes('12.33'), '더 느리면 NEW! 가 안 떠요', b.replace(/\s+/g, ' '));
      const c = clearOnce(600);      // 10.00초 — 더 빠름
      row(c.includes('NEW!') && c.includes('이전 12.33') && c.includes('10.00'), '더 빠르면 NEW! 와 이전 기록', c.replace(/\s+/g, ' '));
      win.eval('showSelect()');
      const card = f.contentDocument.querySelector('#cards .card').innerText;
      row(card.includes('최고 10.00초'), '스테이지 고르는 화면에 최고기록', card.replace(/\s+/g, ' '));
      // 별: 코인을 다 모은 판으로 깬 것처럼 만들어 본다 (스테이지 1, 코인 5개, 목표 12초)
      const clearFull = (frames, all) => win.eval(`save = loadSave(); startStage(STAGES[0]); run.t = ${frames}; run.got.fill(${all}); finish(); document.getElementById('clear').innerText`);
      const star3 = clearFull(600, true);      // 600프레임 = 10초 + 코인 다 → 별 3
      row(star3.includes('★★★') && star3.includes('✅ 코인 다 모으기 (5/5)') && star3.includes('✅ 12초 안에 깨기 (10.00초)'), '별 3개 화면', star3.replace(/\s+/g, ' '));
      const star2 = clearFull(900, true);      // 900프레임 = 15초 + 코인 다 → 별 2
      row(star2.includes('★★☆') && star2.includes('✅ 코인 다 모으기') && star2.includes('⬜ 12초 안에 깨기 (15.00초)') && star2.includes('별 최고기록은 ★★★'), '별 2개 화면 (못 받은 칸은 ⬜)', star2.replace(/\s+/g, ' '));
      const star1 = clearFull(1200, false);    // 1200프레임 = 20초 + 코인 없음 → 별 1
      row(star1.includes('★☆☆') && star1.includes('⬜ 코인 다 모으기 (0/5)') && star1.includes('⬜ 12초 안에 깨기'), '별 1개 화면', star1.replace(/\s+/g, ' '));
      win.eval('showSelect()');
      const starCard = f.contentDocument.querySelector('#cards .card').innerText.replace(/\s+/g, ' ');
      row(starCard.includes('별 ★★★'), '스테이지 카드에 최고 별', starCard);
      const storedStars = JSON.parse(ls.getItem(SAVE_KEY)).stages['1'].stars;
      row(storedStars === 3, '브라우저에 저장된 별', `stages.1.stars = ${storedStars}`);
      const hudText = win.eval(`startStage(STAGES[1]); updateHud(); document.getElementById('hud').innerText`);
      row(hudText.includes('목표 15초'), '플레이 중 목표 시간 표시', hudText);
      win.eval('showSelect()');
      const cardTexts = [...f.contentDocument.querySelectorAll('#cards .card')].map(c => c.innerText.replace(/\s+/g, ' '));
      row(cardTexts.length === 3 && cardTexts.every((t, i) => t.includes('난이도 ' + '★'.repeat(i + 1) + '☆'.repeat(2 - i)) && t.includes(STAGES[i].hint)),
        '스테이지 카드에 난이도와 설명', cardTexts.map(t => t.slice(0, 40)).join(' / '));
      const stored = JSON.parse(ls.getItem(SAVE_KEY));
      row(stored.stages['1'].time === 1000, '브라우저에 저장된 시간', `stages.1.time = ${stored.stages['1'].time} (1/100초)`);
    } catch (e) {
      skip('게임 화면에서 최고기록', '게임 화면을 이 페이지 안에서 열 수 없었어요: ' + e.message);
    } finally {
      try { if (ls) { saved === null ? ls.removeItem(SAVE_KEY) : ls.setItem(SAVE_KEY, saved); } } catch (e) {}
      if (f) f.remove();
    }
  }

  // 7. 게임 화면에서 기록 내보내기·불러오기 (진짜 단추를 눌러 봄. 파일 내려받기는 가로채서 내용만 읽음. 진짜 기록은 빌려 쓰고 돌려놓음)
  if (html !== null) {
    let f = null, ls = null, saved = null;
    try {
      f = await loadFrame('../index.html', 800);
      const win = f.contentWindow, doc = f.contentDocument;
      ls = win.localStorage;
      saved = ls.getItem(SAVE_KEY);
      ls.removeItem(SAVE_KEY);
      const $$ = (id) => doc.getElementById(id);
      const text = (id) => $$(id).innerText.replace(/\s+/g, ' ');
      const waitFor = async (fn, ms = 3000) => {
        const end = Date.now() + ms;
        while (Date.now() < end) { if (fn()) return true; await new Promise(r => setTimeout(r, 50)); }
        return !!fn();
      };
      const sendFile = (content) => {
        const dt = new win.DataTransfer();
        dt.items.add(new win.File([content], 'record.json', { type: 'application/json' }));
        $$('import-file').files = dt.files;
        $$('import-file').dispatchEvent(new win.Event('change'));
      };
      const stored = () => JSON.parse(ls.getItem(SAVE_KEY));

      // 이름 정하는 첫 화면에서도 불러오기가 보여요
      win.eval("save = loadSave(); show('name');");
      row(!!doc.querySelector('#name-screen .io-import') && !$$('name-screen').hidden, '첫 화면(이름 정하기)에 기록 불러오기 단추', '다른 기기에서 쓰던 기록을 이름 정하기 전에 불러올 수 있어요.');

      // 기록이 없을 때 내보내기
      win.eval("showSelect();");
      $$('export-btn').click();
      row(!$$('io-msg').hidden && text('io-msg').includes('내보낼 기록이 없어요'), '기록이 없으면 내보내기를 안내해요', text('io-msg'));

      // 내보내기: 다운로드를 가로채서 파일 내용을 읽는다
      win.eval("save = setOwner('토끼'); recordClear(1, 5, 1100, 3); recordClear(2, 3, 1500, 2); save = loadSave(); showSelect();");
      let blob = null, fileName = null;
      win.URL.createObjectURL = (b) => { blob = b; return 'blob:check'; };
      win.HTMLAnchorElement.prototype.click = function () { fileName = this.download; };
      $$('export-btn').click();
      const exported = blob ? parseImport(await blob.text(), STAGES) : { ok: false, error: '파일이 만들어지지 않았어요' };
      row(exported.ok && exported.save.owner === '토끼' && exported.save.stages['1'].stars === 3 && exported.save.stages['2'].coins === 3 && /^platformer-record-\d{8}\.json$/.test(fileName),
        '기록 내보내기 단추가 파일을 만들어요', exported.ok ? `${fileName} · 토끼 · 스테이지 ${Object.keys(exported.save.stages).length}개` : exported.error);
      row(!$$('io-msg').hidden && text('io-msg').includes('저장했어요'), '내보낸 뒤 안내 글', text('io-msg'));

      // 불러오기: 다른 기록이 든 파일
      const other = makeExportText({ v: 1, owner: '고양이', stages: {
        '1': { cleared: true, coins: 5, time: 900, stars: 3 }, '2': { cleared: true, coins: 7, time: 1200, stars: 3 }, '3': { cleared: true, coins: 9, time: 1500, stars: 3 } } });
      sendFile(other);
      const shown = await waitFor(() => !$$('import-panel').hidden);
      const panel = shown ? text('import-panel') : '';
      row(shown && panel.includes('토끼') && panel.includes('고양이') && panel.includes('바꾸면 지금 기록은 사라져요'), '불러오기 전에 지금 기록과 파일의 기록을 보여 줘요', panel);
      row(stored().owner === '토끼', '확인하기 전에는 기록이 바뀌지 않아요', `저장된 이름: ${stored().owner}`);
      $$('import-no').click();
      row($$('import-panel').hidden && stored().owner === '토끼' && stored().stages['3'] === undefined, '취소하면 기록이 그대로예요', text('io-msg'));

      sendFile(other);
      await waitFor(() => !$$('import-panel').hidden);
      $$('import-yes').click();
      const after = stored();
      row(after.owner === '고양이' && after.stages['3'].coins === 9 && after.stages['1'].time === 900, '바꾸기를 누르면 파일의 기록이 저장돼요', `이름 ${after.owner} · 스테이지 ${Object.keys(after.stages).length}개`);
      row(!$$('select-screen').hidden && $$('who').textContent === '고양이' && $$('total').textContent.includes('21') && text('io-msg').includes('불러왔어요'), '불러온 뒤 화면이 바뀌어요', `${$$('who').textContent} · ${$$('total').textContent} · ${text('io-msg')}`);

      // 잘못된 파일 → 이유를 보여 주고 기록은 그대로
      for (const [label, content, word] of [['글자 파일', '이건 기록이 아니에요', '기록 파일이 아니에요'], ['더 새로운 버전 파일', JSON.stringify({ app: 'platformer-save', v: 2, owner: 'a', stages: {} }), '더 새로운 버전']]) {
        $$('io-msg').textContent = '';
        sendFile(content);
        await waitFor(() => text('io-msg').includes(word));
        row(text('io-msg').includes(word) && $$('import-panel').hidden && stored().owner === '고양이' && $$('io-msg').className.includes('bad'), `${label}을 거절하고 기록은 그대로`, text('io-msg'));
      }

      // 새 기기: 기록이 아무것도 없을 때 첫 화면에서 불러오기
      ls.removeItem(SAVE_KEY);
      win.eval("save = loadSave(); show('name');");
      sendFile(other);
      await waitFor(() => !$$('import-panel').hidden);
      const fresh = text('import-panel');
      $$('import-yes').click();
      row(fresh.includes('지금 기록: 없음') && stored().owner === '고양이' && !$$('select-screen').hidden, '새 기기에서 이름 정하기 전에 불러오면 바로 이어 해요', fresh);
    } catch (e) {
      skip('게임 화면에서 기록 내보내기·불러오기', '게임 화면을 이 페이지 안에서 열 수 없었어요: ' + e.message);
    } finally {
      try { if (ls) { saved === null ? ls.removeItem(SAVE_KEY) : ls.setItem(SAVE_KEY, saved); } } catch (e) {}
      if (f) f.remove();
    }
  }

  // 8. 게임 화면에서 주인별 랭킹·새 주인 (진짜 단추를 눌러 봄. 진짜 기록과 보관된 주인은 빌려 쓰고 돌려놓음)
  if (html !== null) {
    let f = null, ls = null, savedA = null, savedB = null;
    try {
      f = await loadFrame('../index.html', 800);
      const win = f.contentWindow, doc = f.contentDocument;
      ls = win.localStorage;
      savedA = ls.getItem(SAVE_KEY); savedB = ls.getItem(OWNERS_KEY);
      ls.removeItem(SAVE_KEY); ls.removeItem(OWNERS_KEY);
      const $$ = (id) => doc.getElementById(id);
      const text = (id) => $$(id).innerText.replace(/\s+/g, ' ');
      const stored = () => JSON.parse(ls.getItem(SAVE_KEY));
      const owners = () => JSON.parse(ls.getItem(OWNERS_KEY) || '{"owners":{}}').owners;
      const submitName = (name) => { $$('name-input').value = name; $$('name-form').dispatchEvent(new win.Event('submit', { cancelable: true })); };
      const waitFor = async (fn, ms = 3000) => { const end = Date.now() + ms; while (Date.now() < end) { if (fn()) return true; await new Promise(r => setTimeout(r, 50)); } return !!fn(); };

      win.eval("save = setOwner('토끼'); recordClear(1, 5, 1100, 3); recordClear(2, 4, 900, 2); save = loadSave(); showSelect();");
      row(!!$$('ranking-btn') && !!$$('newowner-btn'), '주인별 랭킹·새 주인 단추', '스테이지 고르는 화면에 있어요.');

      // 주인이 한 명일 때
      $$('ranking-btn').click();
      row(!$$('ranking-screen').hidden && text('ranking-table').includes('토끼 (지금)') && text('ranking-note').includes('주인이 한 명뿐이에요'), '주인이 한 명일 때 랭킹 화면', text('ranking-table') + ' · ' + text('ranking-note').slice(0, 60));
      $$('ranking-back').click();
      row(!$$('select-screen').hidden && $$('ranking-screen').hidden, '랭킹 화면에서 돌아와요', '스테이지 고르는 화면');

      // 새 주인 → 취소
      $$('newowner-btn').click();
      row(!$$('name-screen').hidden && stored().owner === '' && !!owners()['토끼'] && !$$('newowner-cancel').hidden && text('owners-note').includes('토끼'), '새 주인으로 시작하면 지금 주인이 보관돼요', `보관: ${Object.keys(owners())} · ${text('owners-note')}`);
      $$('newowner-cancel').click();
      row(!$$('select-screen').hidden && $$('who').textContent === '토끼' && stored().owner === '토끼' && stored().stages['2'].coins === 4 && Object.keys(owners()).length === 0, '취소하면 원래 주인의 기록 그대로 돌아와요', `${$$('who').textContent} · 스테이지 ${Object.keys(stored().stages).length}개 · ${text('io-msg')}`);

      // 새 주인 '고양이' → 스테이지 1 깨기 → 랭킹
      $$('newowner-btn').click();
      submitName('고양이');
      row(!$$('select-screen').hidden && $$('who').textContent === '고양이' && stored().owner === '고양이' && Object.keys(stored().stages).length === 0 && !!owners()['토끼'], '새 이름을 정하면 빈 기록으로 시작해요 (토끼는 보관 중)', `${$$('who').textContent} · 보관: ${Object.keys(owners())}`);
      win.eval("save = loadSave(); startStage(STAGES[0]); run.t = 540; run.got.fill(true); finish(); showSelect();");   // 540프레임 = 9초, 코인 다 → 별 3
      $$('ranking-btn').click();
      const rows = [...doc.querySelectorAll('#ranking-table tr')].map(tr => tr.innerText.replace(/\s+/g, ' '));
      row(rows.length === 3 && rows[1].includes('1위') && rows[1].includes('토끼') && rows[2].includes('2위') && rows[2].includes('고양이 (지금)'), '랭킹: 토끼(별 5)가 1위, 고양이(별 3)가 2위', rows.slice(1).join(' / '));
      const stageText = text('ranking-stages');
      row(stageText.includes('1위 고양이 (지금) 9.00초') && stageText.includes('2위 토끼 11.00초') && stageText.includes('아직 기록이 없어요'), '스테이지별 랭킹: 더 빠른 고양이가 1위', stageText.slice(0, 120));

      // 토끼로 돌아가기: 같은 이름 쓰기
      $$('ranking-back').click();
      $$('newowner-btn').click();
      submitName('토끼');
      row(!$$('select-screen').hidden && $$('who').textContent === '토끼' && stored().stages['2'].coins === 4 && !!owners()['고양이'] && !owners()['토끼'] && text('io-msg').includes('이어 해요'), '보관된 이름을 쓰면 그 주인으로 이어 해요', `${$$('who').textContent} · 스테이지 ${Object.keys(stored().stages).length}개 · 보관: ${Object.keys(owners())}`);

      // 안전: 새 주인 뒤 기록을 불러오면 "원래 주인으로 돌아가기"가 남아 있으면 안 돼요
      $$('newowner-btn').click();
      const dt = new win.DataTransfer();
      dt.items.add(new win.File([makeExportText({ v: 1, owner: '다람쥐', stages: { '1': { cleared: true, coins: 3, time: 1300, stars: 2 } } })], 'r.json', { type: 'application/json' }));
      $$('import-file').files = dt.files;
      $$('import-file').dispatchEvent(new win.Event('change'));
      await waitFor(() => !$$('import-panel').hidden);
      $$('import-yes').click();
      $$('rename').click();
      row(stored().owner === '다람쥐' && $$('newowner-cancel').hidden && !!owners()['토끼'], '새 주인 뒤 불러오면 되돌리기 단추가 남지 않아요', `${stored().owner} · 되돌리기 단추 ${$$('newowner-cancel').hidden ? '숨김' : '보임'} · 보관: ${Object.keys(owners())}`);
      $$('name-input').value = ''; // 이름 바꾸기 화면 그대로 둠
    } catch (e) {
      skip('게임 화면에서 주인별 랭킹', '게임 화면을 이 페이지 안에서 열 수 없었어요: ' + e.message);
    } finally {
      try { if (ls) {
        savedA === null ? ls.removeItem(SAVE_KEY) : ls.setItem(SAVE_KEY, savedA);
        savedB === null ? ls.removeItem(OWNERS_KEY) : ls.setItem(OWNERS_KEY, savedB);
      } } catch (e) {}
      if (f) f.remove();
    }

    // 폰 폭에서 랭킹 화면이 잘리지 않는지 (주인 5명)
    let g = null, ls2 = null, sA = null, sB = null;
    try {
      g = await loadFrame('../index.html', 360);
      const w = g.contentWindow, d = g.contentDocument;
      ls2 = w.localStorage; sA = ls2.getItem(SAVE_KEY); sB = ls2.getItem(OWNERS_KEY);
      ls2.removeItem(SAVE_KEY); ls2.removeItem(OWNERS_KEY);
      w.eval(`save = setOwner('열두글자이름이에요요요'); recordClear(1, 5, 1100, 3);
        for (const n of ['고양이', '강아지', '다람쥐', '아주긴이름입니다만']) { startNewOwner(); setOwner(n); recordClear(1, 5, 1000, 3); recordClear(2, 7, 1200, 3); }
        save = loadSave(); showRanking();`);
      const nRows = d.querySelectorAll('#ranking-table tr').length;
      row(nRows === 6 && d.documentElement.scrollWidth <= 360, '폰 폭(360)에서 랭킹 화면이 안 잘려요', `주인 ${nRows - 1}명 · 내용 폭 ${d.documentElement.scrollWidth}`);
    } catch (e) {
      skip('폰 폭 랭킹 화면', '게임 화면을 이 페이지 안에서 열 수 없었어요: ' + e.message);
    } finally {
      try { if (ls2) {
        sA === null ? ls2.removeItem(SAVE_KEY) : ls2.setItem(SAVE_KEY, sA);
        sB === null ? ls2.removeItem(OWNERS_KEY) : ls2.setItem(OWNERS_KEY, sB);
      } } catch (e) {}
      if (g) g.remove();
    }
  }

  finish();
}

function finish() {
  document.getElementById('summary').innerHTML = bad === 0
    ? `<span class="ok">모두 ${total}개 통과했어요.</span>`
    : `<span class="bad">${total}개 중 ${bad}개가 실패했어요. 아래 ❌ 줄을 확인해 주세요.</span>`;
  document.body.dataset.done = '1';
}

document.getElementById('again').onclick = run;
run();
</script>
</body>
</html>
