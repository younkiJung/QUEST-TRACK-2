<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랫폼 게임 확인</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #1d2433; color: #fff; font-family: sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 6px 10px; border-bottom: 1px solid #3a4560; vertical-align: top; overflow-wrap: anywhere; }
  td:first-child { width: 2em; }
  .ok { color: #7ee08a; }
  .bad { color: #ff7b7b; font-weight: bold; }
  .note { color: #aab4cc; font-size: 14px; }
  #summary { font-size: 20px; margin: 16px 0; }
  button { font-size: 16px; }
  iframe { position: absolute; left: -9999px; top: 0; border: 0; height: 700px; }
</style>
</head>
<body>
<main>
<h1>플랫폼 게임 확인</h1>
<p>게임(../index.html)이 쓰는 파일, 저장, 스테이지, 화면을 하나씩 확인해요.
확인할 때 게임의 진짜 기록은 잠깐 빌려 쓰고 끝나면 그대로 돌려놓아요.</p>
<button id="again">다시 확인</button>
<div id="summary">확인하는 중…</div>
<table id="list"></table>
</main>

<script src="../save.js"></script>
<script src="../physics.js"></script>
<script src="../stages.js"></script>
<script src="bot.js"></script>
<script>
const table = document.getElementById('list');
let total = 0, bad = 0;

function row(ok, title, note) {
  total++;
  if (!ok) bad++;
  const r = table.insertRow();
  r.insertCell().textContent = ok ? '✅' : '❌';
  const c = r.insertCell();
  c.appendChild(document.createTextNode(title));
  if (note) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = note;
    c.appendChild(n);
  }
  c.className = ok ? 'ok' : 'bad';
}

function skip(title, note) {
  const r = table.insertRow();
  r.insertCell().textContent = '➖';
  const c = r.insertCell();
  c.textContent = title + ' (건너뜀)';
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = note;
  c.appendChild(n);
}

function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

function loadFrame(src, width) {
  return new Promise((resolve, reject) => {
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.onload = () => resolve(f);
    f.onerror = () => reject(new Error('불러오지 못했어요'));
    f.src = src;
    document.body.appendChild(f);
    setTimeout(() => reject(new Error('시간 안에 불러오지 못했어요')), 8000);
  });
}

async function run() {
  table.replaceChildren();
  total = 0; bad = 0;
  document.getElementById('summary').textContent = '확인하는 중…';

  // 1. 파일
  const loaded = typeof loadSave === 'function' && typeof stepPlayer === 'function' && Array.isArray(STAGES);
  row(loaded, 'save.js · physics.js · stages.js 불러오기', loaded ? '게임이 쓰는 함수와 스테이지가 모두 있어요.' : '../ 에 있는 파일을 불러오지 못했어요.');
  if (!loaded) return finish();

  // 2. 저장 (진짜 기록은 빌려 쓰고 돌려놓음)
  let backup = null;
  try { backup = localStorage.getItem(SAVE_KEY); } catch (e) {}
  try {
    localStorage.removeItem(SAVE_KEY);
    row(same(loadSave(), { v: 1, owner: '', stages: {} }), '기록이 없을 때', '빈 기록으로 시작해요.');
    row(cleanName('  가   나  ') === '가 나' && cleanName('1234567890123456') === '123456789012' && cleanName(null) === '',
      '이름 다듬기', `"  가   나  " → "${cleanName('  가   나  ')}" · 긴 이름은 12글자까지`);
    setOwner('  토끼 ');
    row(loadSave().owner === '토끼', '주인 이름 저장', `다시 읽으면 "${loadSave().owner}"`);

    const r1 = recordClear(1, 3);
    row(r1.firstClear && r1.saved && loadSave().stages['1'].coins === 3, '처음 깼을 때 저장', '스테이지 1 코인 3개');
    const r2 = recordClear(1, 5);
    row(r2.improved && loadSave().stages['1'].coins === 5, '코인을 더 모으면 기록이 늘어요', '3개 → 5개');
    const r3 = recordClear(1, 2);
    row(!r3.improved && loadSave().stages['1'].coins === 5, '코인이 적으면 기록이 그대로예요', '5개 유지');
    recordClear(2, 4);
    row(totalCoins(loadSave()) === 9, '코인 합계', `5 + 4 = ${totalCoins(loadSave())}`);
    const s = loadSave();
    row(isUnlocked(s, 1) && isUnlocked(s, 2) && isUnlocked(s, 3) && !isUnlocked(s, 4), '스테이지 열림', '깬 스테이지의 다음까지 열려요 (1·2·3 열림, 4 잠김)');
    localStorage.removeItem(SAVE_KEY);
    row(isUnlocked(loadSave(), 1) && !isUnlocked(loadSave(), 2), '처음엔 1번만 열려요', '기록이 없을 때 2번은 잠김');

    localStorage.setItem(SAVE_KEY, '{망가진 글');
    let broken = true;
    try { broken = !same(loadSave(), { v: 1, owner: '', stages: {} }); } catch (e) { broken = true; }
    row(!broken, '망가진 기록', '읽을 수 없는 글이어도 오류 없이 빈 기록으로 시작해요.');
    localStorage.setItem(SAVE_KEY, JSON.stringify({ owner: '<b>x</b>', stages: { '1': { cleared: true, coins: -5 }, 'abc': { cleared: true, coins: 3 }, '2': { cleared: false, coins: 9 } } }));
    const odd = loadSave();
    row(Object.keys(odd.stages).length === 1 && odd.stages['1'].coins === 0, '이상한 기록 걸러내기', `남은 스테이지 ${Object.keys(odd.stages).join(',')} · 음수 코인은 0`);

    // 최고기록 (가장 빠른 시간, 1/100초 단위)
    localStorage.removeItem(SAVE_KEY);
    const t1 = recordClear(1, 5, 1234);
    row(t1.newBest && t1.prevTime === null && loadSave().stages['1'].time === 1234, '처음 깨면 그 시간이 최고기록', '12.34초 저장');
    const t2 = recordClear(1, 5, 1500);
    row(!t2.newBest && t2.bestTime === 1234 && loadSave().stages['1'].time === 1234, '더 느리면 최고기록 그대로', '15.00초로 깼지만 12.34초 유지');
    const t3 = recordClear(1, 5, 1100);
    row(t3.newBest && t3.prevTime === 1234 && loadSave().stages['1'].time === 1100, '더 빠르면 최고기록 바꿈', '12.34초 → 11.00초');
    const t4 = recordClear(1, 5, 1100);
    row(!t4.newBest && loadSave().stages['1'].time === 1100, '같은 시간은 새 기록이 아니에요', '11.00초 = 11.00초');
    const t5 = recordClear(1, 5);
    row(!t5.newBest && loadSave().stages['1'].time === 1100, '시간을 안 주면 기록을 건드리지 않아요', '코인만 저장할 때도 시간이 지워지지 않아요');
    const t6 = recordClear(2, 4, 900);
    row(loadSave().stages['1'].time === 1100 && loadSave().stages['2'].time === 900, '스테이지마다 따로 저장', '1번 11.00초 · 2번 9.00초');
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, owner: '옛', stages: { '1': { cleared: true, coins: 2 } } }));
    const old = loadSave();
    row(old.stages['1'].time === undefined && recordClear(1, 2, 3000).newBest, '시간이 없는 옛 기록', '읽을 수 있고, 다음에 깨면 그 시간이 최고기록이 돼요.');
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, owner: 'x', stages: { '1': { cleared: true, coins: 1, time: -5 }, '2': { cleared: true, coins: 1, time: 'abc' }, '3': { cleared: true, coins: 1, time: 12.5 } } }));
    const badTime = loadSave();
    row(['1', '2', '3'].every(k => badTime.stages[k] && badTime.stages[k].time === undefined), '이상한 시간 걸러내기', '음수·글자·소수는 버리고 나머지 기록은 살려요.');
  } finally {
    try { backup === null ? localStorage.removeItem(SAVE_KEY) : localStorage.setItem(SAVE_KEY, backup); } catch (e) {}
  }

  // 3. 움직임 규칙
  const flat = { width: 1000, start: { x: 100, y: 300 }, platforms: [{ x: 0, y: 390, w: 1000, h: 60 }], coins: [], goal: { x: 990, y: 0, w: 5, h: 5 } };
  let p = newPlayer(flat);
  for (let i = 0; i < 30; i++) stepPlayer(p, {}, flat);
  row(p.onGround && p.y === 390 - PHYS.H, '땅에 서기', `y = ${p.y}`);
  let top = p.y;
  for (let i = 0; i < 80; i++) { stepPlayer(p, { jump: true }, flat); top = Math.min(top, p.y); }
  const height = 390 - PHYS.H - top;
  row(height >= 100 && height <= 130, '점프 높이', `${Math.round(height)} (발판 사이 높이차가 이보다 작아야 올라가요)`);
  p = newPlayer(flat);
  for (let i = 0; i < 30; i++) stepPlayer(p, {}, flat);
  let short = p.y;
  stepPlayer(p, { jump: true }, flat);
  for (let i = 0; i < 80; i++) { stepPlayer(p, {}, flat); short = Math.min(short, p.y); }
  row(390 - PHYS.H - short < height - 20, '짧게 누르면 낮게 뛰어요', `${Math.round(390 - PHYS.H - short)} < ${Math.round(height)}`);
  const wall = { ...flat, platforms: [{ x: 0, y: 390, w: 1000, h: 60 }, { x: 300, y: 200, w: 50, h: 190 }] };
  p = newPlayer(wall);
  for (let i = 0; i < 200; i++) stepPlayer(p, { right: true }, wall);
  row(p.x === 300 - PHYS.W, '벽을 뚫지 못해요', `x = ${p.x}`);
  const pit = { ...flat, platforms: [{ x: 0, y: 390, w: 200, h: 60 }] };
  p = newPlayer(pit);
  for (let i = 0; i < 200 && !p.dead; i++) stepPlayer(p, { right: true }, pit);
  row(p.dead, '구멍에 빠지면 처음 자리로', p.dead ? '떨어짐을 알아차려요.' : '떨어졌는데 알아차리지 못했어요.');
  p = newPlayer(flat);
  for (let i = 0; i < 30; i++) stepPlayer(p, {}, flat);
  const before = p.x;
  for (let i = 0; i < 30; i++) stepPlayer(p, { left: true }, flat);
  row(p.x === Math.max(0, before - 30 * PHYS.SPEED), '왼쪽·오른쪽 걷기', `${before} → ${p.x}`);

  // 4. 스테이지
  row(STAGES.length >= 3 && STAGES.every((st, i) => st.id === i + 1), '스테이지 개수·번호', `${STAGES.length}개 (${STAGES.map(st => st.name).join(' · ')})`);
  for (const st of STAGES) {
    const inside = st.coins.every(c => c.x > 0 && c.x < st.width);
    const reachable = st.coins.every(c => st.platforms.some(r => c.x >= r.x - 10 && c.x <= r.x + r.w + 10 && r.y - c.y >= 10 && r.y - c.y <= 120));
    const notInside = st.coins.every(c => !st.platforms.some(r => c.x >= r.x && c.x <= r.x + r.w && c.y >= r.y && c.y <= r.y + r.h));
    row(st.coins.length > 0 && inside && reachable && notInside, `스테이지 ${st.id} 코인 자리`, `${st.coins.length}개 · 발판 위 120 안에 있고, 발판 속에 묻히지 않았어요.`);
    const bot = tryBot(st);
    row(bot.ok, `스테이지 ${st.id} 깰 수 있어요`, bot.ok ? `로봇이 깃발까지 갔어요 (${(bot.frames / 60).toFixed(1)}초, 코인 ${bot.coins}/${st.coins.length})` : `로봇이 깃발에 닿지 못했어요 (코인 ${bot.coins}/${st.coins.length})`);
  }

  // 4-2. 스테이지 3개가 점점 어려워지는지 (난이도를 숫자로 비교)
  row(STAGES.length === 3, '스테이지는 3개', `지금 ${STAGES.length}개`);
  const stats = STAGES.map(st => {
    // 구멍: 시작~깃발 사이에서 어떤 발판 밑에도 들지 않는 가로 구간
    const spans = st.platforms.map(r => [r.x, r.x + r.w]).sort((a, b) => a[0] - b[0]);
    let reach = 0; const pits = [];
    for (const [a, b] of spans) { if (a > reach) pits.push(a - reach); reach = Math.max(reach, b); }
    const floating = st.platforms.filter(r => r.h === 20).map(r => r.w);
    return { length: st.width, coins: st.coins.length, pits: pits.length, maxPit: Math.max(0, ...pits),
             totalPit: pits.reduce((s, v) => s + v, 0), narrow: Math.min(...floating), seconds: tryBot(st).frames / 60 };
  });
  const rising = (key, label, unit, sign = 1) => {
    const v = stats.map(s => s[key]);
    const ok = v.every((x, i) => i === 0 || (x - v[i - 1]) * sign > 0);
    row(ok, `${label} ${sign > 0 ? '늘어나요' : '줄어들어요'}`, v.map(x => (Number.isInteger(x) ? x : x.toFixed(1)) + unit).join(sign > 0 ? ' < ' : ' > '));
  };
  rising('length', '스테이지 길이가', '');
  rising('coins', '코인 개수가', '개');
  rising('pits', '구멍 개수가', '개');
  rising('maxPit', '가장 넓은 구멍이', '');
  rising('totalPit', '구멍 전체 폭이', '');
  rising('narrow', '가장 좁은 떠 있는 발판이', '', -1);
  rising('seconds', '로봇이 깨는 데 걸리는 시간이', '초');
  const levels = STAGES.map(st => st.level);
  row(same(levels, [1, 2, 3]) && STAGES.every(st => typeof st.hint === 'string' && st.hint.length > 0 && typeof st.name === 'string' && st.name.length > 0),
    '난이도 표시와 설명이 있어요', `level ${levels.join(', ')} · 모든 스테이지에 이름과 한 줄 설명이 있어요.`);
  const shapeOk = STAGES.every(st => {
    const startFree = !st.platforms.some(r => overlaps({ x: st.start.x, y: st.start.y }, r));
    const startStand = st.platforms.some(r => st.start.x >= r.x && st.start.x + PHYS.W <= r.x + r.w && r.y - (st.start.y + PHYS.H) >= 0 && r.y - (st.start.y + PHYS.H) <= 30);
    const goalStand = st.platforms.some(r => st.goal.x >= r.x && st.goal.x + st.goal.w <= r.x + r.w && r.y === st.goal.y + st.goal.h);
    const goalInside = st.goal.x + st.goal.w <= st.width;
    const coinsDistinct = new Set(st.coins.map(c => c.x + ',' + c.y)).size === st.coins.length;
    return startFree && startStand && goalStand && goalInside && coinsDistinct;
  });
  row(shapeOk, '스테이지 데이터 모양', '시작 자리는 발판 바로 위(30 안)에 있고, 깃발은 발판 위·스테이지 안에 있고, 코인이 겹치지 않아요.');

  // 5. 게임 화면 (파일 내용과 모양)
  let html = null;
  try { html = await (await fetch('../index.html')).text(); } catch (e) {}
  if (html === null) {
    skip('화면 글 확인', '파일을 두 번 눌러 열면 읽을 수 없어요. GitHub Pages 주소에서 이 페이지를 열거나 간단한 서버로 열면 확인돼요.');
  } else {
    row(/name="viewport"[^>]*width=device-width/.test(html), '화면 폭에 맞추기 (viewport)', 'width=device-width 가 있어요.');
    row(/id="login-slot"[^>]*>\s*로그인 자리\s*</.test(html), '로그인 단추 자리', '"로그인 자리" 라고만 쓰여 있어요.');
    const slot = html.match(/<div id="login-slot"[^>]*>[\s\S]*?<\/div>/);
    row(!!slot && !/<(button|a|input|form)/i.test(slot[0]) && !/type="password"/i.test(html), '로그인은 아직 없어요', '로그인 자리는 빈 칸이고, 비밀번호 입력도 없어요.');
    const files = { 'index.html': html };
    for (const f of ['physics.js', 'stages.js']) { try { files[f] = await (await fetch('../' + f)).text(); } catch (e) { files[f] = ''; } }
    const storageWords = /localStorage|sessionStorage|indexedDB|document\.cookie/;
    const where = Object.keys(files).filter(f => storageWords.test(files[f]));
    row(where.length === 0, '저장 코드는 save.js 한곳에만', where.length ? `다른 파일에도 있어요: ${where.join(', ')}` : 'index.html · physics.js · stages.js 에는 저장 코드가 없어요.');
    row(!/(sk-|api[_-]?key|password)\s*[:=]/i.test(html), '비밀번호·키가 적혀 있지 않아요', 'index.html 확인');

    // 폰과 컴퓨터 폭에서 잘리는지 (게임을 실제로 열어 봄)
    for (const [w, label] of [[360, '폰 (360)'], [768, '태블릿 (768)'], [1280, '컴퓨터 (1280)']]) {
      try {
        const f = await loadFrame('../index.html', w);
        const d = f.contentDocument;
        const flow = d.documentElement.scrollWidth <= w;
        const slotRect = d.getElementById('login-slot').getBoundingClientRect();
        const slotIn = slotRect.left >= 0 && slotRect.right <= w;
        const nameShown = !d.getElementById('name-screen').hidden || !d.getElementById('select-screen').hidden;
        row(flow && slotIn && nameShown, `화면 폭 ${label}`, `가로로 넘치지 않고 로그인 자리가 보여요 (내용 폭 ${d.documentElement.scrollWidth})`);
        f.remove();
      } catch (e) {
        skip(`화면 폭 ${label}`, '게임 화면을 이 페이지 안에서 열 수 없었어요: ' + e.message);
      }
    }
  }

  // 6. 게임 화면에서 최고기록 (게임을 실제로 열어 깬 것처럼 만들어 봄. 진짜 기록은 빌려 쓰고 돌려놓음)
  if (html !== null) {
    let f = null, ls = null, saved = null;
    try {
      f = await loadFrame('../index.html', 800);
      const win = f.contentWindow;
      ls = win.localStorage;
      saved = ls.getItem(SAVE_KEY);
      ls.removeItem(SAVE_KEY);
      row(win.formatTime(1234) === '12.34' && win.formatTime(500) === '5.00' && win.formatTime(6005) === '60.05', '시간 글 모양', '1234 → 12.34 · 500 → 5.00 · 6005 → 60.05');
      const clearOnce = (frames) => win.eval(`save = loadSave(); startStage(STAGES[0]); run.t = ${frames}; finish(); document.getElementById('clear').innerText`);
      const a = clearOnce(740);      // 12.33초 (740/60)
      row(a.includes('NEW!') && a.includes('첫 기록') && a.includes('12.33'), '처음 깬 화면에 NEW!', a.replace(/\s+/g, ' '));
      const b = clearOnce(900);      // 15.00초 — 더 느림
      row(!b.includes('NEW!') && b.includes('15.00') && b.includes('12.33'), '더 느리면 NEW! 가 안 떠요', b.replace(/\s+/g, ' '));
      const c = clearOnce(600);      // 10.00초 — 더 빠름
      row(c.includes('NEW!') && c.includes('이전 12.33') && c.includes('10.00'), '더 빠르면 NEW! 와 이전 기록', c.replace(/\s+/g, ' '));
      win.eval('showSelect()');
      const card = f.contentDocument.querySelector('#cards .card').innerText;
      row(card.includes('최고 10.00초'), '스테이지 고르는 화면에 최고기록', card.replace(/\s+/g, ' '));
      const cardTexts = [...f.contentDocument.querySelectorAll('#cards .card')].map(c => c.innerText.replace(/\s+/g, ' '));
      row(cardTexts.length === 3 && cardTexts.every((t, i) => t.includes('난이도 ' + '★'.repeat(i + 1) + '☆'.repeat(2 - i)) && t.includes(STAGES[i].hint)),
        '스테이지 카드에 난이도와 설명', cardTexts.map(t => t.slice(0, 40)).join(' / '));
      const stored = JSON.parse(ls.getItem(SAVE_KEY));
      row(stored.stages['1'].time === 1000, '브라우저에 저장된 시간', `stages.1.time = ${stored.stages['1'].time} (1/100초)`);
    } catch (e) {
      skip('게임 화면에서 최고기록', '게임 화면을 이 페이지 안에서 열 수 없었어요: ' + e.message);
    } finally {
      try { if (ls) { saved === null ? ls.removeItem(SAVE_KEY) : ls.setItem(SAVE_KEY, saved); } } catch (e) {}
      if (f) f.remove();
    }
  }

  finish();
}

function finish() {
  document.getElementById('summary').innerHTML = bad === 0
    ? `<span class="ok">모두 ${total}개 통과했어요.</span>`
    : `<span class="bad">${total}개 중 ${bad}개가 실패했어요. 아래 ❌ 줄을 확인해 주세요.</span>`;
  document.body.dataset.done = '1';
}

document.getElementById('again').onclick = run;
run();
</script>
</body>
</html>
