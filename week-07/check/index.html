<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랫폼 게임 확인</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #1d2433; color: #fff; font-family: sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 6px 10px; border-bottom: 1px solid #3a4560; vertical-align: top; overflow-wrap: anywhere; }
  td:first-child { width: 2em; }
  .ok { color: #7ee08a; }
  .bad { color: #ff7b7b; font-weight: bold; }
  .note { color: #aab4cc; font-size: 14px; }
  #summary { font-size: 20px; margin: 16px 0; }
  button { font-size: 16px; }
  iframe { position: absolute; left: -9999px; top: 0; border: 0; height: 700px; }
</style>
</head>
<body>
<main>
<h1>플랫폼 게임 확인</h1>
<p>게임(../index.html)이 쓰는 파일, 저장, 스테이지, 화면을 하나씩 확인해요.
로그인과 저장은 시험용 가짜 서버(주소 끝에 ?fake=1)로 확인해요. 진짜 Google 로그인과 Firestore 는 GitHub Pages 주소에서 사람이 직접 확인해요.
이 기기에 예전에 저장하던 기록(localStorage)은 확인하는 동안만 빌려 쓰고 끝나면 그대로 돌려놓아요.</p>
<button id="again">다시 확인</button>
<div id="summary">확인하는 중…</div>
<table id="list"></table>
</main>

<script src="../save.js"></script>
<script src="../physics.js"></script>
<script src="../stages.js"></script>
<script src="../ranking.js"></script>
<script src="bot.js"></script>
<script>
const table = document.getElementById('list');
let total = 0, bad = 0;

function row(ok, title, note) {
  total++;
  if (!ok) bad++;
  const r = table.insertRow();
  r.insertCell().textContent = ok ? '✅' : '❌';
  const c = r.insertCell();
  c.appendChild(document.createTextNode(title));
  if (note) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = note;
    c.appendChild(n);
  }
  c.className = ok ? 'ok' : 'bad';
}

function skip(title, note) {
  const r = table.insertRow();
  r.insertCell().textContent = '➖';
  const c = r.insertCell();
  c.textContent = title + ' (건너뜀)';
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = note;
  c.appendChild(n);
}

function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

function loadFrame(src, width) {
  return new Promise((resolve, reject) => {
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.onload = () => resolve(f);
    f.onerror = () => reject(new Error('불러오지 못했어요'));
    f.src = src;
    document.body.appendChild(f);
    setTimeout(() => reject(new Error('시간 안에 불러오지 못했어요')), 8000);
  });
}

async function run() {
  table.replaceChildren();
  total = 0; bad = 0;
  document.getElementById('summary').textContent = '확인하는 중…';

  // 1. 파일
  const loaded = typeof loadSave === 'function' && typeof stepPlayer === 'function' && Array.isArray(STAGES) && typeof makeFakeCloud === 'function' && typeof explainError === 'function';
  row(loaded, 'save.js · physics.js · stages.js 불러오기', loaded ? '게임이 쓰는 함수와 스테이지가 모두 있어요.' : '../ 에 있는 파일을 불러오지 못했어요.');
  if (!loaded) return finish();

  // 2. 저장 (로그인·Firestore 창구는 시험용 가짜 서버로 대신한다. 이 페이지의 save.js 에 가짜를 끼워서 쓴다.)
  const fake = makeFakeCloud();
  useCloud(fake);
  const hookLog = { status: [], error: [] };
  setCloudHooks({ status: (s) => hookLog.status.push(s), error: (t) => hookLog.error.push(t) });
  // 새 사람이 로그인한 것처럼 처음부터 시작한다 (rec 가 있으면 서버에서 읽어 온 기록)
  const fresh = async (uid = 'u1', rec = null) => { await flushSave(); endSession(); fake.records = {}; fake.writes = []; fake.delay = 0; fake.failures = {}; hookLog.status = []; hookLog.error = []; startSession(uid, rec); };
  let backupLegacy = null;
  try { backupLegacy = localStorage.getItem(LEGACY_KEY); } catch (e) {}
  try {
    await fresh();
    row(same(loadSave(), { v: 1, owner: '', stages: {} }), '기록이 없을 때', '빈 기록으로 시작해요.');
    row(cleanName('  가   나  ') === '가 나' && cleanName('1234567890123456') === '123456789012' && cleanName(null) === '',
      '이름 다듬기', `"  가   나  " → "${cleanName('  가   나  ')}" · 긴 이름은 12글자까지`);
    setOwner('  토끼 ');
    row(loadSave().owner === '토끼', '주인 이름 저장', `다시 읽으면 "${loadSave().owner}"`);

    const r1 = recordClear(1, 3);
    row(r1.firstClear && r1.saved && loadSave().stages['1'].coins === 3, '처음 깼을 때 저장', '스테이지 1 코인 3개');
    const r2 = recordClear(1, 5);
    row(r2.improved && loadSave().stages['1'].coins === 5, '코인을 더 모으면 기록이 늘어요', '3개 → 5개');
    const r3 = recordClear(1, 2);
    row(!r3.improved && loadSave().stages['1'].coins === 5, '코인이 적으면 기록이 그대로예요', '5개 유지');
    recordClear(2, 4);
    row(totalCoins(loadSave()) === 9, '코인 합계', `5 + 4 = ${totalCoins(loadSave())}`);
    const s = loadSave();
    row(isUnlocked(s, 1) && isUnlocked(s, 2) && isUnlocked(s, 3) && !isUnlocked(s, 4), '스테이지 열림', '깬 스테이지의 다음까지 열려요 (1·2·3 열림, 4 잠김)');
    await fresh();
    row(isUnlocked(loadSave(), 1) && !isUnlocked(loadSave(), 2), '처음엔 1번만 열려요', '기록이 없을 때 2번은 잠김');

    // 서버에서 이상한 값이 와도 안전하게 읽는다
    row(same(fromCloud(null), emptySave()) && same(fromCloud('글자'), emptySave()) && same(fromCloud({ nickname: 5, stages: 'x' }), emptySave()), '서버 문서가 이상해도', '없음·글자·엉뚱한 값은 오류 없이 빈 기록으로 읽어요.');
    const odd = cleanSave({ owner: '<b>x</b>', stages: { '1': { cleared: true, coins: -5 }, 'abc': { cleared: true, coins: 3 }, '2': { cleared: false, coins: 9 } } });
    row(Object.keys(odd.stages).length === 1 && odd.stages['1'].coins === 0, '이상한 기록 걸러내기', `남은 스테이지 ${Object.keys(odd.stages).join(',')} · 음수 코인은 0`);

    // 최고기록 (가장 빠른 시간, 1/100초 단위)
    await fresh();
    const t1 = recordClear(1, 5, 1234);
    row(t1.newBest && t1.prevTime === null && loadSave().stages['1'].time === 1234, '처음 깨면 그 시간이 최고기록', '12.34초 저장');
    const t2 = recordClear(1, 5, 1500);
    row(!t2.newBest && t2.bestTime === 1234 && loadSave().stages['1'].time === 1234, '더 느리면 최고기록 그대로', '15.00초로 깼지만 12.34초 유지');
    const t3 = recordClear(1, 5, 1100);
    row(t3.newBest && t3.prevTime === 1234 && loadSave().stages['1'].time === 1100, '더 빠르면 최고기록 바꿈', '12.34초 → 11.00초');
    const t4 = recordClear(1, 5, 1100);
    row(!t4.newBest && loadSave().stages['1'].time === 1100, '같은 시간은 새 기록이 아니에요', '11.00초 = 11.00초');
    const t5 = recordClear(1, 5);
    row(!t5.newBest && loadSave().stages['1'].time === 1100, '시간을 안 주면 기록을 건드리지 않아요', '코인만 저장할 때도 시간이 지워지지 않아요');
    recordClear(2, 4, 900);
    row(loadSave().stages['1'].time === 1100 && loadSave().stages['2'].time === 900, '스테이지마다 따로 저장', '1번 11.00초 · 2번 9.00초');
    await fresh('u1', { v: 1, owner: '옛', stages: { '1': { cleared: true, coins: 2 } } });
    row(loadSave().stages['1'].time === undefined && recordClear(1, 2, 3000).newBest, '시간이 없는 옛 기록', '읽을 수 있고, 다음에 깨면 그 시간이 최고기록이 돼요.');
    await fresh('u1', { v: 1, owner: 'x', stages: { '1': { cleared: true, coins: 1, time: -5 }, '2': { cleared: true, coins: 1, time: 'abc' }, '3': { cleared: true, coins: 1, time: 12.5 } } });
    const badTime = loadSave();
    row(['1', '2', '3'].every(k => badTime.stages[k] && badTime.stages[k].time === undefined), '이상한 시간 걸러내기', '음수·글자·소수는 버리고 나머지 기록은 살려요.');

    // 별 (한 판 안에서 정해진 별 개수의 최고)
    await fresh();
    const s1 = recordClear(1, 3, 2000, 1);
    row(s1.starsImproved && s1.prevStars === 0 && loadSave().stages['1'].stars === 1, '처음 깨면 그 별이 저장돼요', '별 1개');
    const s2 = recordClear(1, 5, 1100, 3);
    row(s2.starsImproved && s2.prevStars === 1 && loadSave().stages['1'].stars === 3, '별을 더 받으면 늘어요', '1개 → 3개');
    const s3 = recordClear(1, 2, 3000, 1);
    row(!s3.starsImproved && s3.bestStars === 3 && loadSave().stages['1'].stars === 3, '별이 적으면 최고 별 그대로', '1개로 깼어도 3개 유지');
    const s4 = recordClear(1, 5, 1100);
    row(!s4.starsImproved && loadSave().stages['1'].stars === 3, '별을 안 주면 별을 건드리지 않아요', '3개 유지');
    recordClear(2, 4, 900, 2);
    row(loadSave().stages['1'].stars === 3 && loadSave().stages['2'].stars === 2, '스테이지마다 따로 저장', '1번 별 3개 · 2번 별 2개');
    await fresh('u1', { v: 1, owner: '옛', stages: { '1': { cleared: true, coins: 2, time: 1500 } } });
    row(loadSave().stages['1'].stars === undefined && recordClear(1, 2, 1500, 1).starsImproved === true, '별이 없던 옛 기록', '읽을 수 있고 코인·시간은 그대로예요. 다음에 깨면 별이 저장돼요.');
    await fresh('u1', { v: 1, owner: 'x', stages: { '1': { cleared: true, coins: 1, stars: 0 }, '2': { cleared: true, coins: 1, stars: 4 }, '3': { cleared: true, coins: 1, stars: 'abc' } } });
    const badStars = loadSave();
    row(['1', '2', '3'].every(k => badStars.stages[k] && badStars.stages[k].stars === undefined && badStars.stages[k].coins === 1), '이상한 별 걸러내기', '0·4·글자는 버리고 나머지 기록은 살려요.');
    const vs = recordClear(1, 1, 1000, 9);
    row(!vs.starsImproved && vs.bestStars === null, '별 개수가 이상하게 들어와도', '1~3이 아니면 저장하지 않아요.');

    // 기록 내보내기 · 불러오기 (파일 글을 만들고 검사하는 규칙)
    await fresh();
    setOwner('토끼'); recordClear(1, 5, 1100, 3); recordClear(2, 4, 900, 2);
    const cur = loadSave();
    const fileText = makeExportText(cur);
    let fileObj = null;
    try { fileObj = JSON.parse(fileText); } catch (e) {}
    row(!!fileObj && same(Object.keys(fileObj).sort(), ['app', 'exportedAt', 'owner', 'stages', 'v']) && fileObj.app === 'platformer-save' && fileObj.v === 1,
      '내보낸 파일 모양', '앱 표시 · 버전 · 날짜 · 이름 · 스테이지 기록만 들어 있어요 (uid·메일 같은 다른 정보는 없어요).');
    const back = parseImport(fileText, STAGES);
    row(back.ok && same(back.save, cur) && back.dropped === 0, '내보냈다가 불러오면 똑같아요', `이름 ${back.ok ? back.save.owner : '?'} · 스테이지 ${back.ok ? Object.keys(back.save.stages).length : '?'}개`);
    row(same(loadSave(), cur), '파일 검사만으로는 기록이 바뀌지 않아요', '검사는 읽기만 해요.');
    const bads = [
      ['글자', '이건 기록이 아니에요'], ['빈 글', ''], ['배열', '[1,2]'],
      ['다른 앱', JSON.stringify({ app: 'other', v: 1, owner: 'a', stages: {} })],
      ['앱 표시 없음', JSON.stringify({ v: 1, owner: 'a', stages: {} })],
      ['더 새로운 버전', JSON.stringify({ app: 'platformer-save', v: 2, owner: 'a', stages: {} })],
      ['옛 버전', JSON.stringify({ app: 'platformer-save', v: 0, owner: 'a', stages: {} })],
      ['빈 기록', JSON.stringify({ app: 'platformer-save', v: 1, owner: '', stages: {} })],
      ['너무 큰 파일', 'x'.repeat(200001)],
    ];
    const notRejected = bads.filter(([, t]) => { const r = parseImport(t, STAGES); return r.ok || !r.error; }).map(b => b[0]);
    row(notRejected.length === 0, '잘못된 파일은 이유를 알려 주고 거절해요', notRejected.length ? '거절하지 못한 것: ' + notRejected.join(', ') : bads.map(b => b[0]).join(' · '));
    const mixed = parseImport(JSON.stringify({ app: 'platformer-save', v: 1, owner: '  <b>x</b>  ', stages: {
      '1': { cleared: true, coins: 99, stars: 3, time: 500 }, '7': { cleared: true, coins: 1 }, 'abc': { cleared: true, coins: 1 },
      '2': { cleared: false, coins: 3 }, '3': { cleared: true, coins: 2, stars: 9 } } }), STAGES);
    row(mixed.ok && same(Object.keys(mixed.save.stages), ['1', '3']) && mixed.save.stages['1'].coins === 5 && mixed.save.stages['3'].stars === undefined && mixed.dropped === 3 && mixed.save.owner === '<b>x</b>',
      '이상한 값은 걸러내고 나머지는 살려요', mixed.ok ? `남은 스테이지 ${Object.keys(mixed.save.stages)} · 없는 스테이지·망가진 기록 ${mixed.dropped}개 뺌 · 코인은 스테이지 코인 수까지만` : mixed.error);
    const onlyOwner = parseImport(JSON.stringify({ app: 'platformer-save', v: 1, owner: '새 기기', stages: {} }), STAGES);
    row(onlyOwner.ok && onlyOwner.save.owner === '새 기기', '이름만 있는 파일도 불러와요', '아직 스테이지를 안 깬 기록');
    await fresh('u1', { v: 1, owner: '다른 사람', stages: {} });
    const rep = replaceSave(back.save);
    const repDone = await flushSave();
    row(rep.saved && repDone.ok && same(loadSave(), cur) && fake.records.u1.nickname === '토끼', '바꾸기를 하면 파일의 기록이 내 계정에 저장돼요', '지금 기록이 파일의 기록으로 통째로 바뀌고 서버에도 올라가요.');

    // ----- 로그인한 사람의 기록을 서버(Firestore)에 올리는 규칙 -----
    await fresh('u1');
    setOwner('토끼'); recordClear(1, 5, 1100, 3);
    const done1 = await flushSave();
    const doc1 = fake.records.u1;
    const allowedKeys = ['v', 'uid', 'nickname', 'stages', 'updatedAt'];
    row(done1.ok && !!doc1 && doc1.uid === 'u1' && doc1.nickname === '토끼' && doc1.stages['1'].stars === 3, '기록이 서버 문서(records/uid)에 올라가요', `uid ${doc1 && doc1.uid} · 별명 ${doc1 && doc1.nickname} · 스테이지 ${doc1 && Object.keys(doc1.stages)}`);
    row(Object.keys(doc1).every(k => allowedKeys.includes(k)) && !/displayName|email|photoURL|phoneNumber/i.test(JSON.stringify(doc1)), 'Google 이름·메일은 문서에 없어요', `문서 칸: ${Object.keys(doc1).join(', ')}`);
    row(same(Object.keys(toCloud(loadSave(), 'u1')), ['v', 'uid', 'nickname', 'stages']) && same(fromCloud(toCloud(loadSave(), 'u1')), loadSave()), '서버에 보내는 모양과 읽어 오는 모양이 맞아요', 'toCloud → fromCloud 하면 똑같아요.');
    endSession();
    fake.writes = [];
    const offline = recordClear(1, 3);
    await flushSave();
    row(offline.saved === false && fake.writes.length === 0, '로그인 전에는 서버에 올리지 않아요', '저장할 수 없다고 알려 줘요(saved: false).');
    await fresh('u1');
    setOwner('A');
    endSession(); startSession('u2', null);
    row(loadSave().owner === '' && Object.keys(loadSave().stages).length === 0 && sessionUid() === 'u2', '로그아웃하면 다음 사람에게 기록이 안 보여요', 'u1 의 별명이 u2 에게 남지 않아요.');

    // 저장 상태(저장 중 → 저장했어요), 실패와 다시 저장, 여러 번 바뀌어도 마지막 모습으로
    await fresh('u1'); fake.delay = 25;
    setOwner('토끼'); recordClear(1, 5, 1100, 3);
    await flushSave();
    row(hookLog.status.includes('saving') && hookLog.status[hookLog.status.length - 1] === 'saved' && hookLog.error[hookLog.error.length - 1] === null, '저장 상태가 저장 중 → 저장했어요로 바뀌어요', hookLog.status.join(' → '));
    await fresh('u1');
    setOwner('토끼');
    await flushSave();
    fake.failNext('write', 'permission-denied');
    recordClear(1, 5, 1100, 3);
    const failed = await flushSave();
    const errText = hookLog.error[hookLog.error.length - 1] || '';
    row(!failed.ok && hookLog.status[hookLog.status.length - 1] === 'error' && errText.includes('저장하지 못했어요') && errText.includes('권한') && errText.includes('(오류 코드: permission-denied)') && !fake.records.u1.stages['1'],
      '저장이 실패하면 이유를 알려 줘요', errText);
    row(loadSave().stages['1'] && loadSave().stages['1'].stars === 3, '저장이 실패해도 화면의 기록은 그대로예요', '메모리의 기록은 남아 있어요.');
    retrySave();
    const retried = await flushSave();
    row(retried.ok && fake.records.u1.stages['1'].stars === 3 && hookLog.error[hookLog.error.length - 1] === null, '"다시 저장"을 누르면 올라가요', '실패했던 기록이 서버에 올라가고 오류 글이 지워져요.');
    await fresh('u1'); fake.delay = 20;
    setOwner('토끼'); recordClear(1, 5, 1100, 3); recordClear(2, 4, 900, 2); recordClear(3, 7, 1500, 2);
    await flushSave();
    row(fake.writes.length <= 2 && Object.keys(fake.records.u1.stages).length === 3, '빠르게 여러 번 바뀌어도 마지막 모습이 올라가요', `서버에 ${fake.writes.length}번 쓰고 스테이지 ${Object.keys(fake.records.u1.stages).length}개가 모두 들어갔어요.`);
    fake.delay = 0;

    // 오류 글: 코드마다 이유와 고치는 방법
    const msgCases = [
      ['auth/popup-blocked', 'login', '팝업'], ['auth/popup-closed-by-user', 'login', '닫혔어요'], ['auth/unauthorized-domain', 'login', '승인된 도메인'],
      ['auth/operation-not-allowed', 'login', '사용 설정'], ['auth/network-request-failed', 'login', '인터넷'], ['permission-denied', 'write', 'firestore.rules'],
      ['unavailable', 'read', '인터넷'], ['not-found', 'read', 'Firestore Database'], ['unauthenticated', 'write', '다시 로그인'], ['app/sdk-load-failed', 'init', '새로고침'],
    ];
    const msgBad = msgCases.filter(([code, where, word]) => { const t = explainError({ code }, where); return !t.includes(word) || !t.includes(`(오류 코드: ${code})`); }).map(c => c[0]);

        const clearItems = audit(win, clearBox);
        const big = clearItems.find(x => x.name === 'span.t-big');
        const restMax = clearItems.filter(x => x.name !== 'span.t-big').sort((a, b) => b.size - a.size)[0];
        row(!!big && big.size > restMax.size, `클리어 화면에서 걸린 시간이 가장 커요 (${name})`, big ? `걸린 시간 ${big.size}px · 그다음 ${restMax.size}px (${restMax.name})` : '찾지 못했어요');
        row(clearBox.scrollHeight <= clearBox.clientHeight + 1, `클리어 화면이 스크롤 없이 한 화면에 들어와요 (${name})`, `내용 ${clearBox.scrollHeight}px · 칸 ${clearBox.clientHeight}px`);
        const btns = [...clearBox.querySelectorAll('button')].map(b => b.getBoundingClientRect());
        const box = clearBox.getBoundingClientRect();
        row(btns.length >= 3 && btns.every(r => r.top >= box.top && r.bottom <= box.bottom + 1 && r.left >= box.left && r.right <= box.right + 1), `클리어 화면 단추가 모두 보여요 (${name})`, `단추 ${btns.length}개`);

        // 글자 크기와 대비 (모든 화면)
        const all = Object.entries(states).flatMap(([st, v]) => v.items.map(x => ({ ...x, st })));
        const tooSmall = all.filter(x => x.size < 13);
        const lowContrast = all.filter(x => x.ratio < x.need);
        const smallest = all.reduce((m, x) => (x.size < m.size ? x : m), all[0]);
        row(tooSmall.length === 0, `글자가 너무 작지 않아요 (${name})`, tooSmall.length ? '13px보다 작은 글자: ' + tooSmall.slice(0, 4).map(x => `${x.st} ${x.name} ${x.size}px`).join(', ') : `가장 작은 글자 ${smallest.size}px (${smallest.st} · ${smallest.name}) · 확인한 글자 ${all.length}개 · 화면 ${Object.keys(states).length}종`);
        row(lowContrast.length === 0, `글자와 바탕의 색 대비가 충분해요 (${name})`, lowContrast.length ? '대비가 모자란 글자: ' + lowContrast.slice(0, 4).map(x => `${x.st} ${x.name} ${x.ratio.toFixed(1)}:1`).join(', ') : '모든 글자 4.5:1 이상 (큰 글자 3:1)');
        const wide = Object.entries(states).filter(([, v]) => v.overflow > width);
        row(wide.length === 0, `화면이 옆으로 잘리지 않아요 (${name})`, wide.length ? wide.map(([k, v]) => `${k} ${v.overflow}px`).join(', ') : `모든 화면의 내용 폭이 ${width}px 이하`);
        const slotRect = $$('login-slot').getBoundingClientRect();
        row(slotRect.left >= 0 && slotRect.right <= width, `로그인·로그아웃 단추 자리가 화면 안에 있어요 (${name})`, `자리 ${Math.round(slotRect.left)}~${Math.round(slotRect.right)}px / 화면 ${width}px`);
      });
    }

    // 14. 처음 온 사람을 위한 안내 (진단 표 1~5번). 폰과 컴퓨터 폭에서 처음 방문한 사람처럼 따라가 봄.
    for (const [width, label] of [[360, '폰 360'], [1280, '컴퓨터 1280']]) {
      await withGame(`처음 온 사람 안내 (${label})`, width, '?fake=1', async (g) => {
        const { $$, win, doc, text, shown } = g;
        putRecord(g, 'u1', '처음');
        await signIn(g, 'u1');

        // 1번: 목표 안내
        const howto = text('howto');
        row(shown($$('howto')) && howto.includes('깃발') && howto.includes('스테이지를 깨요') && howto.includes('코인'), `1번 목표 안내가 스테이지 고르는 화면에 있어요 (${label})`, howto);
        win.eval("startStage(STAGES[0]);");
        const ready = $$('ready');
        row(shown(ready) && ready.innerText.includes('깃발까지 가요') && ready.innerText.includes('12초') && ready.innerText.includes('움직이면 시간이 시작돼요'), `1번 시작할 때 목표 안내 띠가 보여요 (${label})`, text('ready'));
        row(win.getComputedStyle(ready).pointerEvents === 'none', '안내 띠는 아래 단추를 가리지 않아요', 'pointer-events: none (폰의 ◀ ▶ ▲ 단추가 그대로 눌려요)');

        // 3번: 움직이기 전에는 시간이 안 흐르고, 움직이면 시작
        const before = win.eval(`(() => { for (let i = 0; i < 60; i++) update(); return { t: run.t, started: run.started, ground: run.player.onGround, y: run.player.y }; })()`);
        row(before.t === 0 && before.started === false && before.ground && before.y === 390 - 32 && shown(ready), `3번 움직이기 전에는 시간이 안 흘러요 (${label})`, `60프레임(1초) 뒤에도 시간 ${before.t} · 캐릭터는 땅에 내려앉았고 · 안내 띠가 그대로 보여요`);
        const after = win.eval(`(() => { keys.right = true; update(); const r = { t: run.t, started: run.started }; keys.right = false; return r; })()`);
        row(after.started === true && after.t === 1 && ready.hidden, `3번 처음 움직이면 시간이 시작돼요 (${label})`, `움직인 첫 프레임에 시간 ${after.t} · 안내 띠 사라짐`);
        win.eval("startStage(STAGES[0]);");
        row(win.eval('run.t') === 0 && win.eval('run.started') === false && !ready.hidden, `3번 다시 하기를 하면 다시 준비 상태예요 (${label})`, '시간 0 · 안내 띠 다시 보임');
        const jumpFirst = win.eval(`(() => { keys.jump = true; update(); const r = { t: run.t, started: run.started }; keys.jump = false; return r; })()`);
        row(jumpFirst.started && jumpFirst.t === 1, `3번 점프로 시작해도 시간이 시작돼요 (${label})`, '걷지 않고 점프만 눌러도 시작');

        // 2번: 조작 설명
        const touchHelp = $$('touch-help'), keysHelp = $$('keys-help');
        if (width < 700) {
          row(shown(touchHelp) && !shown(keysHelp) && touchHelp.innerText.includes('점프') && touchHelp.innerText.includes('길게'), `2번 폰에 조작 설명이 보여요 (${label})`, text('touch-help'));
          row(shown($$('pad-jump')) && $$('pad-jump').innerText.includes('점프'), '2번 점프 단추에 "점프" 글자가 있어요', $$('pad-jump').innerText.replace(/\s+/g, ' '));
        } else {
          row(shown(keysHelp) && !shown(touchHelp) && keysHelp.innerText.includes('점프') && keysHelp.innerText.includes('길게'), `2번 컴퓨터에는 키보드 조작 설명이 보여요 (${label})`, text('keys-help').slice(0, 70));
        }

        // 4번: 난이도는 글자, 별 규칙 안내
        win.eval("showSelect();");
        const cards = [...doc.querySelectorAll('#cards .card')].map(c => c.innerText.replace(/\s+/g, ' '));
        row(cards.length === 3 && cards[0].includes('난이도 쉬움') && cards[1].includes('난이도 보통') && cards[2].includes('난이도 어려움') && cards.every(c => !c.includes('난이도 ★')), `4번 난이도는 글자(쉬움·보통·어려움)로 보여요 (${label})`, cards.map(c => c.slice(0, 26)).join(' / '));
        row(howto.includes('별은 최대 3개') && howto.includes('코인을 다 모으면') && howto.includes('목표 시간 안에'), `4번 별을 받는 방법이 미리 적혀 있어요 (${label})`, howto);

        // 5번: 단추 정리
        const more = $$('more');
        const inMore = ['rename', 'export-btn'].every(id => more.contains($$(id))) && [...doc.querySelectorAll('#select-screen .io-import')].every(b => more.contains(b));
        const openButtons = [...doc.querySelectorAll('#select-screen button')].filter(b => !b.classList.contains('card') && shown(b));
        row(!more.open && inMore && openButtons.length === 1 && openButtons[0].id === 'ranking-btn', `5번 처음 보이는 단추는 "주인별 랭킹" 하나뿐이에요 (${label})`, `접힌 "더 보기" 안에 이름 바꾸기·기록 내보내기·불러오기 · 보이는 단추: ${openButtons.map(b => b.innerText).join(', ')}`);
        const moreText = more.textContent.replace(/\s+/g, ' ');
        row(moreText.includes('다른 사람이 같은 기기로') && moreText.includes('로그아웃') && moreText.includes('같은 사람의 이름만 바꿔요'), `5번 한 기기를 여러 사람이 쓰는 방법과 "이름 바꾸기"의 뜻이 적혀 있어요 (${label})`, moreText.slice(0, 140));
        const hiddenBefore = !shown($$('rename')) && !shown($$('export-btn'));
        more.open = true;
        row(hiddenBefore && shown($$('rename')) && shown($$('export-btn')), `5번 "더 보기"를 열면 단추가 보여요 (${label})`, '열기 전에는 안 보이고 열면 보임');
      });
    }

    // 15. 화면 폭 (로그인 화면 기준): 폰·태블릿·컴퓨터에서 옆으로 잘리지 않는지
    for (const [w, label] of [[360, '폰 (360)'], [768, '태블릿 (768)'], [1280, '컴퓨터 (1280)']]) {
      await withGame(`화면 폭 ${label}`, w, '?fake=1', async (g) => {
        const flow = g.doc.documentElement.scrollWidth <= w;
        const slotRect = g.$$('login-slot').getBoundingClientRect();
        row(flow && slotRect.left >= 0 && slotRect.right <= w && g.screen() === 'login', `화면 폭 ${label}`, `가로로 넘치지 않고 로그인 단추가 보여요 (내용 폭 ${g.doc.documentElement.scrollWidth})`);
      });
    }
  }

  finish();
}

function finish() {
  document.getElementById('summary').innerHTML = bad === 0
    ? `<span class="ok">모두 ${total}개 통과했어요.</span>`
    : `<span class="bad">${total}개 중 ${bad}개가 실패했어요. 아래 ❌ 줄을 확인해 주세요.</span>`;
  document.body.dataset.done = '1';
}

document.getElementById('again').onclick = run;
run();
</script>
</body>
</html>
