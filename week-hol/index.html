<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시간 여행 등불</title>
<style>
  :root {
    --night: #05060f;
    --panel: rgba(14, 15, 30, 0.9);
    --line: #33375f;
    --text: #f1f2ff;
    --muted: #a9aed6;
    --gold: #ffcf5a;
    --good: #5fd38a;
    --bad: #ff7a7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--night);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
  }
  #stage.explore { touch-action: none; }
  #stage.shake { animation: shake 0.25s; }
  @keyframes shake {
    25% { transform: translate(-6px, 3px); }
    75% { transform: translate(6px, -3px); }
  }

  /* 배경 그림 */
  #bg { position: absolute; inset: 0; transition: opacity 0.9s; }
  #bg svg { width: 100%; height: 100%; display: block; }
  #bg.fade { opacity: 0; }
  #fx, #dark { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff8dc; opacity: 0; pointer-events: none; transition: opacity 0.6s; }
  #flash.on { opacity: 1; transition: opacity 0.15s; }

  /* SVG 움직임 */
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 0.35s ease-in-out infinite alternate; }
  .flame.slow { animation-duration: 0.5s; }
  @keyframes flick { to { transform: scale(0.88, 1.12) skewX(4deg); } }
  .glass { animation: glass 3s ease-in-out infinite alternate; }
  @keyframes glass { from { opacity: 0.55; } to { opacity: 1; } }
  .wave { animation: wave 9s linear infinite; }
  .wave.w2 { animation-duration: 6s; }
  .wave.w3 { animation-duration: 4s; }
  @keyframes wave { to { transform: translateX(-500px); } }
  .bob { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 4.5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(7px) rotate(0.8deg); } }
  .float { transform-box: fill-box; transform-origin: center; animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-9px) rotate(-6deg); } }
  .twinkle { animation: twinkle 2.4s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }
  .fog { animation: fog 26s linear infinite alternate; }
  @keyframes fog { to { transform: translateX(120px); } }
  .spark path { transform-box: fill-box; transform-origin: center; animation: spark 1.3s ease-in-out infinite; }
  @keyframes spark { 0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.5; } 50% { transform: scale(1.15) rotate(45deg); opacity: 1; } }
  .hs.got .spark { display: none; }
  #stage.explore .hs { cursor: pointer; }
  #theses { transform-box: fill-box; transform-origin: 50% 0; transition: all 0.15s; }

  /* 위쪽 상태 표시 */
  #hud {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.5s;
  }
  #hud.show { opacity: 1; }
  #lanternIcon { font-size: 30px; filter: drop-shadow(0 0 8px var(--gold)); transition: filter 0.8s; }
  .meter { flex: 1; max-width: 260px; }
  .meter small { color: var(--muted); font-size: 12px; }
  .bar { height: 8px; background: rgba(255, 255, 255, 0.12); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #c98a1b, var(--gold)); transition: width 0.8s; }
  .hud-btn {
    margin-left: auto;
    display: flex;
    gap: 6px;
  }
  .chip {
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: rgba(14, 15, 30, 0.75);
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: 6px 10px;
    cursor: pointer;
  }

  /* 탐색 안내 */
  #hint {
    position: absolute;
    top: calc(max(12px, env(safe-area-inset-top)) + 48px);
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 560px);
    text-align: center;
    background: rgba(14, 15, 30, 0.8);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 15px;
    z-index: 5;
    display: none;
  }
  #hint b { color: var(--gold); }

  /* 시대 제목 */
  #titleCard {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s;
    z-index: 6;
    padding: 16px;
  }
  #titleCard.show { opacity: 1; }
  #titleCard small { color: var(--gold); letter-spacing: 3px; font-size: 15px; }
  #titleCard h1 { font-size: clamp(30px, 7vw, 54px); margin: 10px 0 0; text-shadow: 0 0 30px rgba(255, 207, 90, 0.5); }

  /* 대화창 */
  #dialog {
    position: absolute;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(calc(100vw - 32px), 860px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 18px;
    display: none;
    gap: 14px;
    z-index: 7;
    cursor: pointer;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }
  #dialog.show { display: flex; }
  #portrait { width: 92px; height: 92px; flex: none; }
  #portrait:empty { display: none; }
  #portrait svg { width: 100%; height: 100%; }
  .dlg-body { flex: 1; min-width: 0; }
  #who { font-weight: bold; color: var(--gold); margin-bottom: 4px; min-height: 1em; }
  #text { font-size: 17px; line-height: 1.7; min-height: 3.4em; white-space: pre-line; }
  #dialog.narr #text { color: #dfe2ff; font-style: italic; }
  #dialog.diary #text { color: #f3e3b5; font-family: "Batang", serif; }
  #next { text-align: right; color: var(--gold); font-size: 13px; opacity: 0; }
  #dialog.ready #next { opacity: 1; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  #choices { display: grid; gap: 8px; margin-top: 10px; }
  #choices:empty { display: none; }
  #choices button {
    font: inherit;
    font-size: 15px;
    color: var(--text);
    text-align: left;
    background: #1c1f3c;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
  }
  #choices button:hover:not(:disabled) { border-color: var(--gold); }
  #choices button.right { background: rgba(95, 211, 138, 0.2); border-color: var(--good); }
  #choices button.wrong { background: rgba(255, 122, 122, 0.16); border-color: var(--bad); }
  #choices button .ref { display: block; color: var(--gold); font-size: 13px; }

  /* 망치 · 그림자 */
  #hammerBox {
    position: absolute;
    left: 50%;
    bottom: 22%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 6;
    display: none;
  }
  #hammerBtn {
    font-size: 54px;
    background: rgba(255, 207, 90, 0.15);
    border: 2px solid var(--gold);
    border-radius: 50%;
    width: 110px;
    height: 110px;
    cursor: pointer;
  }
  #hammerBtn:active { transform: rotate(-30deg) scale(0.95); }
  #hammerCount { margin-top: 8px; font-size: 18px; color: var(--gold); text-shadow: 0 0 10px #000; }
  #shadowBox {
    position: absolute;
    left: 50%;
    top: 12%;
    width: min(60vw, 340px);
    transform: translateX(-50%) scale(var(--s, 1));
    transition: transform 0.5s, opacity 0.8s;
    z-index: 4;
    display: none;
    filter: drop-shadow(0 0 30px rgba(130, 70, 200, 0.6));
  }
  #shadowBox svg { width: 100%; }
  #shadowHp { text-align: center; color: #c9a6ff; font-size: 14px; margin-top: 4px; }

  /* 토스트 · 패널 */
  #toast {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, 10px);
    background: rgba(40, 30, 5, 0.92);
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 10px 18px;
    border-radius: 99px;
    font-size: 15px;
    opacity: 0;
    transition: all 0.4s;
    z-index: 9;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 6, 15, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .sheet {
    width: min(100%, 620px);
    max-height: 88vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px 22px;
    line-height: 1.7;
  }
  .sheet h1 { margin: 4px 0 10px; font-size: clamp(26px, 6vw, 38px); }
  .sheet h2 { font-size: 18px; margin: 18px 0 8px; color: var(--gold); }
  .sheet .tag { color: var(--gold); letter-spacing: 2px; font-size: 14px; }
  .sheet p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .card-item { border-left: 3px solid var(--gold); padding: 6px 12px; margin-bottom: 8px; background: rgba(255, 207, 90, 0.06); border-radius: 0 10px 10px 0; }
  .card-item b { color: var(--gold); font-size: 14px; }
  .endings { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .endings div { border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; font-size: 14px; }
  .endings .got { border-color: var(--gold); color: var(--gold); }
  .big-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    font: inherit;
    font-weight: bold;
    font-size: 17px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: var(--gold);
    color: #2a1d00;
    cursor: pointer;
  }
  .big-btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  #start .sheet { text-align: center; background: rgba(14, 15, 30, 0.7); }
  #start h1 { font-size: clamp(36px, 9vw, 60px); text-shadow: 0 0 40px rgba(255, 207, 90, 0.6); }
  .start-lantern { font-size: 70px; filter: drop-shadow(0 0 30px var(--gold)); animation: blink 2.5s infinite; }

  @media (max-width: 600px) {
    #portrait { width: 62px; height: 62px; }
    #text { font-size: 15px; }
    #dialog { padding: 12px 14px; gap: 10px; }
    #choices button { font-size: 14px; padding: 9px 12px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <canvas id="fx"></canvas>
  <canvas id="dark"></canvas>
  <div id="flash"></div>
  <div id="shadowBox"><div id="shadowArt"></div><div id="shadowHp"></div></div>

  <div id="hud">
    <div id="lanternIcon">🏮</div>
    <div class="meter">
      <small>등불의 밝기 <span id="lightNum">0</span>%</small>
      <div class="bar"><i id="lightBar"></i></div>
    </div>
    <div class="hud-btn">
      <button class="chip" id="cardBtn">📖 0</button>
      <button class="chip" id="diaryBtn">📜 0/5</button>
      <button class="chip" id="soundBtn">🔊</button>
    </div>
  </div>
  <div id="hint"></div>
  <div id="titleCard"><small id="titleTag"></small><h1 id="titleText"></h1></div>

  <div id="hammerBox">
    <button id="hammerBtn">🔨</button>
    <div id="hammerCount">0 / 95</div>
  </div>

  <div id="dialog">
    <div id="portrait"></div>
    <div class="dlg-body">
      <div id="who"></div>
      <div id="text"></div>
      <div id="choices"></div>
      <div id="next">눌러서 계속 ▼</div>
    </div>
  </div>

  <div id="toast"></div>
  <div class="overlay" id="panel"><div class="sheet" id="panelBody"></div></div>
  <div class="overlay show" id="start">
    <div class="sheet">
      <div class="start-lantern">🏮</div>
      <div class="tag">기독교 역사 여행 게임</div>
      <h1>시간 여행 등불</h1>
      <p>할로윈 밤, 할머니 다락방에서 찾은 낡은 등불.<br>그 빛을 따라 할로윈의 뿌리를 찾아 2천 년을 여행하세요.</p>
      <p class="muted">🔊 소리가 나와요 · 마우스나 손가락으로 어둠을 비춰요</p>
      <p class="muted" id="startEndings"></p>
      <button class="big-btn" id="startBtn">▶ 여행 시작하기</button>
    </div>
  </div>
</div>

<script>
/* ───────────── 효과음 (파일 없이 코드로 만든 소리) ───────────── */
const sound = {
  ctx: null, master: null, noiseBuf: null, amb: [], timers: [], muted: false,
  init() {
    if (this.ctx) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.8;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  tone(f, dur, type = "sine", vol = 0.15, delay = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, freq, type = "lowpass", vol = 0.2, delay = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(this.master);
    s.start(t); s.stop(t + dur + 0.05);
  },
  blip() { this.tone(520 + Math.random() * 80, 0.04, "square", 0.02); },
  good() { [660, 880, 1100].forEach((f, i) => this.tone(f, 0.3, "triangle", 0.12, i * 0.08)); },
  bad() { this.tone(200, 0.35, "sawtooth", 0.05); this.tone(140, 0.45, "sawtooth", 0.05, 0.1); },
  find() { [1046, 1318, 1568, 2093].forEach((f, i) => this.tone(f, 0.35, "sine", 0.08, i * 0.06)); },
  bell() { [1, 2, 2.76, 5.4].forEach((m, i) => this.tone(392 * m, 3 - i * 0.5, "sine", 0.12 / (i + 1))); },
  hammer() { this.noise(0.12, 500, "lowpass", 0.6); this.tone(90, 0.15, "sine", 0.3); },
  whoosh() { this.noise(1.2, 900, "bandpass", 0.25); },
  stopAmb() {
    this.amb.forEach(n => { try { n.stop && n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} });
    this.amb = [];
    this.timers.forEach(clearInterval);
    this.timers = [];
  },
  loopNoise(freq, type, vol) {
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noiseBuf; s.loop = true; f.type = type; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f).connect(g).connect(this.master); s.start();
    this.amb.push(s, f, g);
    return g;
  },
  lfo(param, rate, depth) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.value = rate; g.gain.value = depth;
    o.connect(g).connect(param); o.start();
    this.amb.push(o, g);
  },
  drone(f, vol) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.value = f; g.gain.value = vol;
    o.connect(g).connect(this.master); o.start();
    this.amb.push(o, g);
  },
  ambient(kind) {
    if (!this.ctx) return;
    this.stopAmb();
    if (kind === "wind") {
      this.lfo(this.loopNoise(450, "bandpass", 0.05).gain, 0.13, 0.03);
    } else if (kind === "fire") {
      this.loopNoise(220, "lowpass", 0.05);
      this.timers.push(setInterval(() => {
        if (Math.random() < 0.6) this.noise(0.03, 3000, "highpass", 0.07 * Math.random());
      }, 90));
    } else if (kind === "waves") {
      this.lfo(this.loopNoise(650, "lowpass", 0.09).gain, 0.12, 0.07);
    } else if (kind === "drone") {
      this.drone(110, 0.02); this.drone(164.8, 0.015); this.drone(220, 0.008);
    } else if (kind === "city") {
      this.loopNoise(280, "lowpass", 0.035);
    } else if (kind === "dark") {
      this.drone(55, 0.05); this.drone(58, 0.04);
    }
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.8;
  }
};

/* ───────────── 배경 그림 (SVG) ───────────── */
const rnd = (a, b) => a + Math.random() * (b - a);

function stars(n, maxY) {
  let s = "";
  for (let i = 0; i < n; i++) {
    s += `<circle class="twinkle" cx="${rnd(0, 1000)}" cy="${rnd(0, maxY)}" r="${rnd(0.6, 2)}" fill="#fff" style="animation-delay:${rnd(0, 2.4)}s"/>`;
  }
  return s;
}
function spark(x, y, size = 11) {
  const s = size, k = size * 0.25;
  return `<g class="spark" transform="translate(${x},${y})"><path d="M0 ${-s} L${k} ${-k} L${s} 0 L${k} ${k} L0 ${s} L${-k} ${k} L${-s} 0 L${-k} ${-k}Z" fill="#fff6c8"/></g>`;
}
// 단서가 숨어 있는 곳: 그림 + 누를 수 있는 동그라미 + 반짝이
function hs(id, x, y, art, r = 40, size = 11) {
  return `<g class="hs" data-id="${id}">${art}<circle class="hit" cx="${x}" cy="${y}" r="${r}" fill="transparent"/>${spark(x + r * 0.5, y - r * 0.6, size)}</g>`;
}
function svgWrap(inner, defs = "") {
  return `<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice"><defs>${defs}</defs>${inner}</svg>`;
}
const glowDef = (id, color) =>
  `<radialGradient id="${id}"><stop offset="0" stop-color="${color}" stop-opacity="0.75"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></radialGradient>`;
const fireAt = (x, y, s = 1) => `
  <circle cx="${x}" cy="${y - 20 * s}" r="${90 * s}" fill="url(#fireGlow)"/>
  <path d="M${x - 22 * s} ${y} L${x + 22 * s} ${y - 8 * s} M${x - 20 * s} ${y - 8 * s} L${x + 24 * s} ${y}" stroke="#3b2210" stroke-width="${7 * s}"/>
  <path class="flame" d="M${x - 20 * s} ${y - 4 * s} Q${x - 18 * s} ${y - 40 * s} ${x} ${y - 70 * s} Q${x + 18 * s} ${y - 40 * s} ${x + 20 * s} ${y - 4 * s}Z" fill="#ff7a1a"/>
  <path class="flame slow" d="M${x - 11 * s} ${y - 4 * s} Q${x - 9 * s} ${y - 28 * s} ${x} ${y - 46 * s} Q${x + 9 * s} ${y - 28 * s} ${x + 11 * s} ${y - 4 * s}Z" fill="#ffd34d"/>`;

const SCENES = {
  attic: () => svgWrap(`
    <rect width="1000" height="600" fill="url(#aw)"/>
    <path d="M0 150 L500 20 L1000 150" stroke="#3a2617" stroke-width="28" fill="none"/>
    <path d="M0 250 L500 120 L1000 250" stroke="#2f1f13" stroke-width="16" fill="none"/>
    <rect x="110" y="120" width="26" height="380" fill="#3a2617"/>
    <rect x="864" y="120" width="26" height="380" fill="#3a2617"/>
    <polygon points="455,200 545,200 720,560 280,560" fill="#aabfff" opacity="0.07"/>
    <circle cx="500" cy="160" r="62" fill="#17223f" stroke="#3a2617" stroke-width="10"/>
    <circle cx="520" cy="145" r="16" fill="#f3eccd"/>
    <path d="M438 160 H562 M500 98 V222" stroke="#3a2617" stroke-width="7"/>
    <rect y="480" width="1000" height="120" fill="#20150d"/>
    <path d="M0 520 H1000 M0 560 H1000 M150 480 V520 M420 520 V560 M700 480 V520 M880 520 V560" stroke="#2c1d12" stroke-width="3"/>

/* ───────────── 화면 도구 ───────────── */
const $ = id => document.getElementById(id);
const stage = $("stage"), bgEl = $("bg"), dialog = $("dialog");
const wait = ms => new Promise(r => setTimeout(r, ms));
// 시대별 탐색 5 + 망치 1 + 문제·선택 11 + 그림자 1 = 등불 100%
const TOTAL_POINTS = 5 + 1 + 11 + 1;
const AMBIENT = { attic: "wind", celtic: "fire", church: "drone", wittenberg: "fire", ship: "waves", modern: "city", festival: "drone" };
const PARTICLES = { attic: "dust", celtic: "ember", church: "dust", wittenberg: "ember", ship: "spray", modern: "leaf", festival: "glow" };
let particleKind = "dust";

function setLight(v) {
  S.light = Math.max(0, Math.min(100, v));
  $("lightBar").style.width = S.light + "%";
  $("lightNum").textContent = Math.round(S.light);
  $("lanternIcon").style.filter = `drop-shadow(0 0 ${4 + S.light / 4}px var(--gold)) brightness(${0.6 + S.light / 200})`;
}
function addPoint() {
  S.points++;
  setLight((S.points / TOTAL_POINTS) * 100);
}
function updateHud() {
  $("cardBtn").textContent = `📖 ${S.verses.length}`;
  $("diaryBtn").textContent = `📜 ${S.diary.size}/5`;
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1900);
}
function gainVerse(key) {
  if (!key || S.verses.includes(key)) return;
  S.verses.push(key);
  updateHud();
  toast(`📖 말씀 카드 획득 · ${VERSES[key].ref}`);
}
function flash() {
  $("flash").classList.add("on");
  sound.whoosh();
  setTimeout(() => $("flash").classList.remove("on"), 250);
}
function shakeStage() {
  stage.classList.remove("shake");
  void stage.offsetWidth;
  stage.classList.add("shake");
}
async function setScene(key) {
  bgEl.classList.add("fade");
  await wait(700);
  bgEl.innerHTML = key === "festival" ? SCENES.church(true) : SCENES[key]();
  particleKind = PARTICLES[key];
  sound.ambient(AMBIENT[key]);
  if (key === "church" || key === "festival") sound.bell();
  bgEl.classList.remove("fade");
  await wait(500);
}
async function titleCard(tag, title) {
  S.phase = "title";
  dialog.classList.remove("show");
  $("titleTag").textContent = tag;
  $("titleText").textContent = title;
  $("titleCard").classList.add("show");
  await wait(2300);
  $("titleCard").classList.remove("show");
  await wait(700);
}

/* ───────────── 대화 ───────────── */
let advanceFn = null, typing = false, skipType = false;

function showSpeaker(who) {
  const p = PEOPLE[who === "diary" ? "narr" : who];
  dialog.className = "show" + (who === "narr" ? " narr" : "") + (who === "diary" ? " diary" : "");
  $("portrait").innerHTML = p.art();
  $("who").textContent = who === "diary" ? "할머니의 일기" : p.name;
  $("choices").innerHTML = "";
  if (S.phase !== "battle") S.phase = "dialog";
}
function typeText(text) {
  return new Promise(res => {
    const el = $("text");
    let i = 0;
    typing = true;
    skipType = false;
    const tick = () => {
      if (skipType) i = text.length;
      el.textContent = text.slice(0, i);
      if (i >= text.length) { typing = false; res(); return; }
      if (i % 3 === 0) sound.blip();
      i++;
      setTimeout(tick, 26);
    };
    tick();
  });
}
function waitAdvance() {
  dialog.classList.add("ready");
  return new Promise(r => { advanceFn = r; });
}
function advance() {
  if (typing) { skipType = true; return; }
  if (advanceFn) {
    const f = advanceFn;
    advanceFn = null;
    dialog.classList.remove("ready");
    f();
  }
}
dialog.addEventListener("click", advance);
addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); advance(); }
});

async function say(who, text) {
  showSpeaker(who);
  await typeText(text);
  await waitAdvance();
}
// 보기를 누르면 그 번호를 돌려줌
async function ask(who, q, options) {
  showSpeaker(who);
  await typeText(q);
  return new Promise(res => {
    const box = $("choices");
    box.innerHTML = "";
    options.forEach((o, i) => {
      const b = document.createElement("button");
      b.innerHTML = o;
      b.onclick = e => {
        e.stopPropagation();
        box.querySelectorAll("button").forEach(x => (x.disabled = true));
        res(i);
      };
      box.appendChild(b);
    });
  });
}
function mark(goodIndex, picked) {
  $("choices").querySelectorAll("button").forEach((b, j) => {
    if (j === goodIndex) b.classList.add("right");
    else if (j === picked) b.classList.add("wrong");
  });
}
async function quiz(who, q, options, answer, explain, verse) {
  const i = await ask(who, q, options);
  mark(answer, i);
  const ok = i === answer;
  if (ok) { sound.good(); addPoint(); } else { sound.bad(); shakeStage(); }
  await wait(900);
  await say("narr", (ok ? "✨ 등불이 밝아졌어요!\n" : "등불이 깜빡입니다… 정답은 초록색이에요.\n") + explain);
  if (verse) {
    gainVerse(verse);
    await say("narr", `📖 ${VERSES[verse].text}\n(${VERSES[verse].ref})`);
  }
  return ok;
}
// good 이 붙은 보기를 고르면 true
async function choice(who, q, options) {
  const i = await ask(who, q, options.map(o => o.text));
  const goodIndex = options.findIndex(o => o.good);
  mark(goodIndex, i);
  const ok = i === goodIndex;
  if (ok) { sound.good(); addPoint(); } else { sound.bad(); shakeStage(); }
  await wait(800);
  return ok;
}

/* ───────────── 등불로 어둠 비추기 ───────────── */
const darkCv = $("dark"), dctx = darkCv.getContext("2d");
const fxCv = $("fx"), fctx = fxCv.getContext("2d");
let W = 0, H = 0, DPR = 1, darkAlpha = 0.6;

function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  for (const c of [darkCv, fxCv]) { c.width = W * DPR; c.height = H * DPR; }
  dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize);
resize();

function setPointer(e) { S.pointer.x = e.clientX; S.pointer.y = e.clientY; }
stage.addEventListener("pointermove", setPointer);
stage.addEventListener("pointerdown", setPointer);

function lightRadius() {
  return Math.min(W, H) * 0.14 * (1 + S.light / 110);
}
function drawDark(t) {
  const target = { explore: 0.96, title: 0.85, battle: 0.7, idle: 0.55 }[S.phase] ?? Math.max(0.12, 0.6 - S.light * 0.004);
  darkAlpha += (target - darkAlpha) * 0.06;
  dctx.globalCompositeOperation = "source-over";
  dctx.clearRect(0, 0, W, H);
  dctx.fillStyle = `rgba(3, 3, 10, ${darkAlpha})`;
  dctx.fillRect(0, 0, W, H);
  const r = (S.phase === "explore" ? lightRadius() : Math.max(W, H) * 0.5) * (1 + Math.sin(t / 130) * 0.015);
  const { x, y } = S.pointer;
  dctx.globalCompositeOperation = "destination-out";
  const g = dctx.createRadialGradient(x, y, r * 0.15, x, y, r);
  g.addColorStop(0, "rgba(0,0,0,1)");
  g.addColorStop(0.7, "rgba(0,0,0,0.85)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  dctx.fillStyle = g;
  dctx.beginPath();
  dctx.arc(x, y, r, 0, Math.PI * 2);
  dctx.fill();
  if (S.phase === "explore") {
    dctx.globalCompositeOperation = "source-over";
    const warm = dctx.createRadialGradient(x, y, 0, x, y, r);
    warm.addColorStop(0, "rgba(255, 190, 80, 0.16)");
    warm.addColorStop(1, "rgba(255, 190, 80, 0)");
    dctx.fillStyle = warm;
    dctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

/* 떠다니는 불씨 · 먼지 · 물보라 · 낙엽 */
let parts = [];
function spawn() {
  const k = particleKind;
  if (k === "ember") return { x: W * rnd(0.3, 0.7), y: H * rnd(0.45, 0.6), vx: rnd(-0.3, 0.3), vy: rnd(-1.4, -0.6), life: rnd(60, 140), r: rnd(1, 2.5), c: `255,${~~rnd(120, 200)},60` };
  if (k === "spray") return { x: rnd(0, W), y: H * rnd(0.6, 0.9), vx: rnd(-1.5, -0.5), vy: rnd(-0.8, 0.2), life: rnd(40, 90), r: rnd(0.8, 1.8), c: "200,220,255" };
  if (k === "leaf") return { x: rnd(0, W), y: -10, vx: rnd(-0.6, 0.6), vy: rnd(0.6, 1.3), life: H / 0.8, r: rnd(2.5, 4), c: `${~~rnd(200, 240)},${~~rnd(90, 140)},40` };
  if (k === "glow") return { x: rnd(0, W), y: H * rnd(0.5, 1), vx: rnd(-0.2, 0.2), vy: rnd(-0.7, -0.3), life: rnd(120, 260), r: rnd(1.5, 3.5), c: "255,210,110" };
  return { x: rnd(0, W), y: rnd(0, H), vx: rnd(-0.2, 0.2), vy: rnd(-0.15, 0.15), life: rnd(120, 300), r: rnd(0.6, 1.6), c: "230,220,200" };
}
function drawParticles() {
  fctx.clearRect(0, 0, W, H);
  if (parts.length < 70 && Math.random() < 0.5) parts.push({ ...spawn(), age: 0 });
  parts = parts.filter(p => p.age < p.life);
  for (const p of parts) {
    p.age++; p.x += p.vx + Math.sin(p.age / 20) * 0.2; p.y += p.vy;
    const a = Math.sin((p.age / p.life) * Math.PI);
    fctx.fillStyle = `rgba(${p.c},${a * 0.8})`;
    fctx.beginPath();
    fctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    fctx.fill();
  }
}
function loop(t) {
  drawDark(t);
  drawParticles();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function isLit(el) {
  const b = el.querySelector(".hit").getBoundingClientRect();
  const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
  return Math.hypot(cx - S.pointer.x, cy - S.pointer.y) < lightRadius() * 0.8 + b.width / 2;
}
// 단서를 모두 찾으면 끝. 일기 조각은 찾지 않아도 넘어갈 수 있음
function explore(sceneKey, hintText, scored = true) {
  return new Promise(resolve => {
    const spots = [...bgEl.querySelectorAll(".hs")];
    const need = spots.filter(s => !s.dataset.id.startsWith("diary")).length;
    let found = 0, busy = false;
    const showHint = () => {
      S.phase = "explore";
      stage.classList.add("explore");
      dialog.classList.remove("show");
      $("hint").style.display = "block";
      $("hint").innerHTML = `🏮 ${hintText}<br><b>단서 ${found} / ${need}</b>`;
    };
    showHint();
    spots.forEach(el => {
      el.addEventListener("click", async () => {
        if (busy || S.phase !== "explore" || el.classList.contains("got") || !isLit(el)) return;
        busy = true;
        el.classList.add("got");
        sound.find();
        stage.classList.remove("explore");
        $("hint").style.display = "none";
        const id = el.dataset.id;
        const [who, text] = CLUES[sceneKey][id];
        if (id.startsWith("diary")) {
          S.diary.add(id);
          updateHud();
          toast("📜 할머니의 일기 조각을 찾았어요!");
        }
        await say(who, text);
        if (!id.startsWith("diary")) found++;
        busy = false;
        if (found >= need) {
          if (scored) addPoint();
          resolve();
        } else showHint();
      });
    });
  });
}

/* ───────────── 망치 미니게임 ───────────── */
function hammerGame() {
  return new Promise(resolve => {
    S.phase = "dialog";
    dialog.classList.remove("show");
    const box = $("hammerBox"), btn = $("hammerBtn"), paper = $("theses");
    let hits = 0;
    const need = 10;
    box.style.display = "block";
    $("hammerCount").textContent = "0 / 95 · 망치를 두드리세요!";
    btn.onclick = () => {
      if (hits >= need) return;
      hits++;
      sound.hammer();
      shakeStage();
      const p = hits / need;
      paper.style.opacity = 0.3 + p * 0.7;
      paper.style.transform = `translateY(${(1 - p) * 40}px) rotate(${(1 - p) * -14}deg)`;
      $("hammerCount").textContent = `${Math.round(95 * p)} / 95`;
      if (hits === need) {
        sound.bell();
        addPoint();
        setTimeout(() => { box.style.display = "none"; resolve(); }, 700);
      }
    };
  });
}

async function battle() {
  S.phase = "battle";
  sound.ambient("dark");
  const box = $("shadowBox");
  $("shadowArt").innerHTML = shadowArt();
  box.style.display = "block";
  box.style.opacity = 1;
  let hp = DOUBTS.length;
  const showHp = () => {
    $("shadowHp").textContent = "그림자 " + "●".repeat(hp) + "○".repeat(DOUBTS.length - hp);
    box.style.setProperty("--s", 0.55 + hp * 0.11);
  };
  showHp();
  for (const [doubt, key] of DOUBTS) {
    let ok = false;
    while (!ok) {
      const others = shuffle(Object.keys(VERSES).filter(k => k !== key && S.verses.includes(k))).slice(0, 2);
      const cards = shuffle([key, ...others]);
      const i = await ask("shadow", doubt + "\n\n어떤 말씀 카드로 대답할까요?",
        cards.map(k => `<span class="ref">📖 ${VERSES[k].ref}</span>${VERSES[k].text}`));
      ok = cards[i] === key;
      mark(cards.indexOf(key), i);
      if (ok) {
        sound.good(); flash(); hp--; showHp();
        await wait(700);
      } else {
        sound.bad(); shakeStage();
        box.style.setProperty("--s", 0.55 + hp * 0.11 + 0.15);
        setLight(S.light - 3);
        await wait(700);
        await say("shadow", "흐흐… 그 말씀은 지금 내 말에 맞는 대답이 아니야!");
        showHp();
      }
    }
  }
  addPoint();
  box.style.opacity = 0;
  await wait(800);
  box.style.display = "none";
  S.phase = "dialog";
  sound.ambient("city");
}

  await say("sean", "안녕! 난 숀이야. 고향에선 할로윈 밤에 순무를 파서 등불을 만들었어. '인색한 잭' 이야기 알아?");
  await say("sean", "잭은 악마를 두 번이나 속였대. 그래서 죽은 뒤 천국에도 못 가고 악마도 안 받아 줘서, 숯불 한 조각을 순무에 넣고 영원히 떠돌게 됐대.");
  await say("harang", "으… 그게 호박 등불 이야기였어?");
  await say("sean", "미국엔 순무보다 크고 파기 쉬운 호박이 많대! 거기선 호박으로 만들 거야.");
  await say("narr", "바닷바람에 등불이 흔들리며 미래의 장면들까지 비춥니다.");
  await explore("ship", "등불로 갑판과 바다를 비춰 단서를 찾으세요.");
  await quiz("sean", "그럼 문제! 인색한 잭은 결국 어떻게 됐게?",
    ["천국에 갔다", "천국도 지옥도 못 가고 등불을 들고 어둠 속을 떠돈다", "왕이 되었다", "호박 농부가 되었다"], 1,
    "잭오랜턴은 갈 곳 없이 어둠 속을 떠도는 영혼의 등불이에요. 하지만 성경은 길 잃은 사람을 위한 진짜 빛이 있다고 말해요.", "john8");
  await quiz("sean", "미국 아이들은 할로윈 밤에 집집마다 \"트릭 오어 트릿!\"이라고 외친대. 무슨 뜻일까?",
    ["안녕하세요, 행복한 할로윈!", "사탕 주세요, 안 주면 장난칠 거예요!", "고맙습니다!", "같이 놀자!"], 1,
    "귀엽게 들리지만 '안 주면 골탕 먹이겠다'는 뜻이에요. 1930년대 할로윈 장난이 심했던 시절에 퍼진 말이에요.");
  await say("harang", "그래도… 사탕 받는 건 좋잖아.");
  const ok = await choice("narr", "하랑에게 뭐라고 말할까요?", [
    { text: "\"받아 내는 날 말고, 우리가 먼저 나눠 주는 날로 만들면 어때?\"", good: true },
    { text: "\"맞아, 많이 받으면 최고지!\"", good: false },
    { text: "\"안 주는 집엔 진짜 장난치자!\"", good: false }
  ]);
  if (ok) {
    S.friend++;
    await say("harang", "먼저 나눠 주는 날… 그거 괜찮다. 받는 것보다 더 신날 수도 있겠는데?");
  } else {
    await say("harang", "그치? 히히.");
    await say("narr", "등불이 조금 어두워졌어요.");
  }
  await say("narr", "그리스도인은 받아 내는 사람이 아니라 먼저 선을 베푸는 사람으로 부름받았어요.");
  gainVerse("rom12");
  await say("narr", `📖 ${VERSES.rom12.text}\n(${VERSES.rom12.ref})`);
  flash();
}

async function era5() {
  await setScene("modern");
  await titleCard("다섯 번째 시대 · 오늘", "10월 31일, 우리 동네");
  await say("narr", "눈을 떠 보니 우리 동네 거리예요. 오늘, 10월 31일 밤. 가게마다 해골과 피 묻은 가면이 걸려 있어요.");
  await say("harang", "돌아왔다…! 근데 이상해. 아까는 그냥 신났는데, 지금은 다 다르게 보여.");
  await explore("modern", "등불로 거리를 비춰 단서를 찾으세요.");
  await say("narr", "띠링! 하랑의 휴대폰에 파티 초대 메시지가 왔어요. 둘은 잠깐 들러 보기로 했어요.");
  await say("party", "왔구나! 마침 잘 왔어. 이거 봐, 위저 보드! 오늘 밤 귀신 한번 불러 보자!");
  const ok = await choice("narr", "어떻게 할까요?", [
    { text: "\"난 안 할래. 대신 우리 다른 게임 하자!\" 웃으며 다른 놀이를 제안한다.", good: true },
    { text: "다들 하니까 같이 한다.", good: false },
    { text: "무서우니까 아무 말 없이 구경만 한다.", good: false }
  ]);
  if (ok) {
    S.friend++;
    await say("harang", "…나도 안 할래. 우리 다른 거 하자.");
  } else {
    await say("harang", "어… 등불이 거의 꺼질 것 같아.");
  }
  await say("narr", "장난처럼 보여도 죽은 자를 부르는 놀이는 성경이 금하는 일이에요. 친구를 탓하기보다 웃으며 다른 길을 보여 주는 게 빛의 자녀다운 행동이에요.");
  gainVerse("eph5");
  await say("narr", `📖 ${VERSES.eph5.text}\n(${VERSES.eph5.ref})`);
  await say("narr", "파티를 나와 집으로 가는 어두운 골목. 갑자기 등불이 크게 흔들립니다.");
  await say("harang", "저, 저기… 해골 장식 뒤에서 뭔가 움직였어!");
  await quiz("narr", "이럴 때 기억할 말씀은 무엇일까요?",
    ["너희 안에 계신 이가 세상에 있는 자보다 크심이라", "무서우면 무조건 도망쳐라", "귀신은 할로윈에만 나온다", "등불만 있으면 다 괜찮다"], 0,
    "그리스도인은 어둠을 즐기지도, 두려워하지도 않아요. 어둠보다 크신 분이 함께 계시기 때문이에요.", "john4");
  await say("narr", "골목 끝의 어둠이 뭉치더니, 거대한 그림자가 되었어요!");
  $("shadowArt").innerHTML = shadowArt();
  await say("shadow", "흐흐… 등불 하나로 날 이길 수 있을까? 너희 마음에 의심을 잔뜩 심어 주지!");
  await say("narr", "지금까지 모은 말씀 카드로 그림자의 말에 대답하세요!");
  await battle();
  await say("narr", "그림자가 흩어지고, 골목이 등불 빛으로 환해졌어요.");
  S.friend++;
  await say("harang", "…너 아까 진짜 멋있었어. 말씀이 이렇게 힘이 있는 줄 몰랐어.");
}

async function finale() {
  const together = S.friend >= 4;
  await say("narr", "집 앞 갈림길. 왼쪽 길에선 파티 음악이, 오른쪽 교회에선 '빛의 축제' 찬양 소리가 들려와요.");
  if (together) {
    S.harangPaint = false;
    await say("harang", "나… 오늘은 너랑 같이 갈래. 해골 분장도 지웠어. 어때?");
  } else {
    await say("harang", "난… 그래도 파티에 가 볼래. 넌 어떻게 할 거야?");
  }
  const pick = await ask("narr", "오늘 밤, 너는 어디로 갈까요?", [
    "🎃 해골과 가면이 가득한 할로윈 파티에 간다",
    "🏮 교회의 '빛의 축제'에 가서 이웃 아이들에게 말씀 사탕을 나눈다"
  ]);

  if (pick === 0) {
    sound.bad();
    setLight(S.light / 2);
    await say("narr", "파티는 시끄러웠지만 마음 한구석이 계속 허전했어요. 손에 든 등불은 겨우 깜빡일 뿐이에요.");
    return showEnding("dim", "등불이 다시 희미해졌어요…",
      `<p>다섯 시대에서 본 장면들이 계속 마음에 남아 있어요.</p><p style="color:var(--gold)">"너희는 세상의 빛이라" (마태복음 5:14)</p><p class="muted">빛은 언제든 다시 고를 수 있어요.</p>`);
  }

  sound.good();
  setLight(100);
  await setScene("festival");
  if (together) {
    await say("narr", "교회 마당엔 등불이 가득하고, 아이들이 다윗과 에스더 옷을 입고 웃고 있어요.");
    await say("harang", "분장 지우니까 시원하다! 사탕에 쪽지 붙이는 거, 내가 할게! \"예수님은 세상의 빛이에요.\"");
    await say("narr", "두 개의 등불이 나란히 빛났어요.");
  } else {
    await say("narr", "교회 마당엔 등불이 가득해요. 너는 이웃 아이들에게 사탕과 쪽지를 나눴어요. \"예수님은 세상의 빛이에요.\"");
    await say("narr", "하랑에게 메시지를 보냈어요. \"오늘 같이 본 거 잊지 마. 다음엔 같이 오자!\"\n잠시 뒤 답장이 왔어요. \"…생각해 볼게. 고마워.\"");
  }

  if (S.diary.size === 5) {
    await setScene("attic");
    await say("narr", "축제가 끝나고 다락방으로 돌아오니, 누군가 등불 옆에 앉아 있었어요.");
    await say("grandma", "돌아왔구나. 그 등불, 할미가 네 나이 때 처음 들었던 거란다.");
    await say("grandma", "할미도 처음엔 할로윈이 그냥 재미있는 날인 줄 알았지. 등불이 뿌리를 보여 주기 전까지는.");
    await say("grandma", "일기 조각을 다 모았구나. 그럼 이제 알겠지? 등불은 혼자 들고 있으라고 주신 게 아니야.");
    await say("grandma", "이제 네가 등불지기란다. 다음 사람에게 이 빛을 건네주렴.");
    return showEnding("true", "🏮 새로운 등불지기",
      `<p>할머니의 등불이 너에게 이어졌어요. 어둠을 두려워하지도, 즐기지도 않고 빛을 전하는 사람. 그게 등불지기예요.</p>
       <h2>할머니의 일기</h2>${[1, 2, 3, 4, 5].map(n => { const id = "diary" + n; const scene = Object.keys(CLUES).find(s => CLUES[s][id]); return `<div class="card-item">${CLUES[scene][id][1].replace(/\n/g, "<br>")}</div>`; }).join("")}`);
  }
  if (together) {
    return showEnding("together", "✨ 함께 빛나는 밤",
      `<p>너는 빛을 골랐고, 하랑도 함께 빛을 골랐어요. 1517년의 같은 밤 루터가 말씀을 붙잡았듯이, 오늘 밤 두 사람도 말씀을 붙잡았어요.</p>`);
  }
  return showEnding("alone", "🏮 먼저 켜진 등불",
    `<p>오늘은 혼자였지만, 네 등불은 환하게 빛났어요. 하랑의 마음에도 작은 불씨가 남았어요. 다음엔 하랑의 선택이 달라질지도 몰라요.</p>`);
}

async function game() {
  await prologue();
  await era1();
  await era2();
  await era3();
  await era4();
  await era5();
  await finale();
}

/* ───────────── 시작 화면 ───────────── */
bgEl.innerHTML = SCENES.attic();
particleKind = "dust";
const got = loadEndings();
if (got.length) $("startEndings").textContent = `모은 엔딩 ${got.length} / 4`;
$("startBtn").onclick = () => {
  sound.init();
  $("start").classList.remove("show");
  game();
};
</script>
